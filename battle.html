<!DOCTYPE html>
<html>
<head>
    <title>D&D Virtual Table Top</title>
    <meta name="viewport" content="width=540, user-scalable=no" charset="UTF-8">
<style>
    body { margin: 0; background: #121212; color: #eee; display: flex; justify-content: center; font-family: 'Segoe UI', sans-serif; min-height: 100vw ; overflow: auto; }
    #screen { width: 540px; height: 960px; background: #222; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 0 50px #000; position: relative; }
    #grid { width: 540px; height: 540px; position: relative; background-color: #333; border-bottom: 2px solid #444; flex-shrink: 0; overflow: hidden; background-size: cover; background-position: center; }
    #log { height: 140px; background: #111; padding: 15px; overflow-y: auto; color: #00ff00; font-family: monospace; border-bottom: 2px solid #444; display: flex; flex-direction: column-reverse; box-sizing: border-box; flex-shrink: 0; }
    #controls { display: flex; flex-direction: row; flex: 1; background: #1a1a1a; padding: 10px; gap: 10px; align-items: stretch; box-sizing: border-box; }
    #stats-panel { width: 85px; display: flex; flex-direction: column; justify-content: center; background: #2c3e50; border-radius: 4px; padding: 8px; font-size: 0.7rem; color: white; flex-shrink: 0; border-left: 4px solid #3498db; box-sizing: border-box; }
    #stats-panel strong { display: block; margin-bottom: 2px; color: #f1c40f; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .btn-group { display: grid; flex: 1; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(2, 1fr); gap: 8px; min-width: 0; }
    .btn-group button { width: 100%; height: 100%; font-size: 0.85rem; background: #444; color: white; border: 1px solid #555; border-radius: 4px; cursor: pointer; }
    #end-turn-btn { width: 45px; background: #d35400; color: white; font-weight: bold; writing-mode: vertical-lr; text-orientation: upright; border: none; border-radius: 4px; flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; letter-spacing: 2px; font-size: 0.8rem; }
    .token { width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; position: absolute; z-index: 3; transition: 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28); pointer-events: none; box-shadow: 0 4px 10px rgba(0,0,0,0.5); font-size: 14px; color: white; border: 2px solid white; background-size: cover; background-position: center; }
    .active-ring { position: absolute; width: 50px; height: 50px; border: 3px solid #f1c40f; border-radius: 50%; transition: 0.3s; pointer-events: none; z-index: 2; box-shadow: 0 0 15px #f1c40f; }
    .grid-overlay { position: absolute; width: 100%; height: 100%; background-image: linear-gradient(rgba(255,255,255,0.35) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.1) 1px, transparent 1px); background-size: 54px 54px; pointer-events: none; z-index: 10; }
    .cell { width: 54px; height: 54px; float: left; z-index: 1; position: relative; cursor: pointer; }
	.cell.obstacle {     background-color: rgba(0,0,0,0.6); }
    .btn-move-active { background-color: #27ae60 !important; border: 2px solid white !important; }
    button:disabled { opacity: 0.4; filter: grayscale(1); cursor: not-allowed; }
	.reaction-panel {
    position: absolute;
    top: 20px;
    left: 20px;
    width: 300px;
    background: rgba(0,0,0,0.8);
    padding: 10px;
    border: 2px solid #fff;
    display: none;
    color: white;
	z-index: 11;
}

.reaction-entry {
    margin-bottom: 10px;
}

</style>
</head>
<body>

<div id="screen">
    <div id="grid">
        <div class="grid-overlay"></div>
        <div id="active-ring" class="active-ring"></div>
    </div>
    <div id="log">> Battle Initialized.</div>
	<div id="reaction-panel" class="reaction-panel"></div>
    <div id="controls">
        <div id="stats-panel">
            <strong id="unit-name">Name</strong>
            <span id="unit-hp">HP: 0</span>
            <span id="unit-speed">SPD: 0</span>
        </div>
        <div class="btn-group" id="action-bar"></div>
        <button id="end-turn-btn" onclick="endTurn()">END</button>
    </div>
</div>

<script>
const Bus = {
    events: {},
    on(event, cb) { if(!this.events[event]) this.events[event] = []; this.events[event].push(cb); },
    emit(event, data) { if(this.events[event]) this.events[event].forEach(cb => cb(data)); }
};

let staticObstacles = [], units = [], turn = 0, isMoving = false; battleXP = 0; isReactionPhase = false; roundStarted = false; isHealing = false; healerUnit = null;

const firstPCIndex = units.findIndex(u => u.type === "pc");


function init() {

    const savedData = localStorage.getItem('currentBattle');
    if (!savedData) return Bus.emit('LOG', "ERR: No battle data found!");

    const data = JSON.parse(savedData);

    // FIXED: use data.monsterDB, not savedData.monsterDB
    window.MONSTER_DB = data.monsterDB;

    const grid = document.getElementById('grid');
    staticObstacles = data.obstacles || [];
    
    const mapUrls = {
        "green_1": "assets/missions/combat_green_1.png",
        "default": "assets/missions/combat_green_1.png"
    };

    const bgUrl = mapUrls[data.missionId] || mapUrls["default"];
    grid.style.backgroundImage = `url('${bgUrl}')`;

	units = [
		...data.party.map(p => ({
			...p,
			type: 'pc',
			speed: 6,
			maxSpeed: 6,
			hasAction: true,
			isHiding: false,
			usedRage: false,   // Barbarian
			canSing: true,     // Bard
			canHide: true,     // Miner
			maxHp: p.hp
		})),
        ...data.monsters.map(m => ({
            ...m,
            type: 'monster',
            speed: 6,
            maxSpeed: 6,
            hasAction: true,
            maxHp: m.hp
        }))
    ];

    grid.innerHTML = '<div class="grid-overlay"></div><div id="active-ring" class="active-ring"></div>';

    for (let i = 0; i < 100; i++) {
        let cell = document.createElement('div');
        cell.className = 'cell';
        let cx = i % 10, cy = Math.floor(i / 10);
		    // ⭐ Mark obstacles
		if (staticObstacles.some(o => o.x === cx && o.y === cy)) {
			cell.classList.add("obstacle");
		}
		cell.onclick = () => {
			// ⭐ HEALING TARGET SELECTION
			if (isHealing) {
				const target = units.find(t =>
					t.x === cx &&
					t.y === cy &&
					t.hp > 0 &&
					t.type === "pc"
				);

				if (!target) {
					Bus.emit('LOG', "Invalid healing target.");
					isHealing = false;
					healerUnit = null;
					return;
				}

				applyHeal(healerUnit, target);

				isHealing = false;
				healerUnit = null;
				return;
			}

			// ⭐ NORMAL CLICK BEHAVIOR
			processMove(cx, cy);
		};

		
		
		
        grid.appendChild(cell);
    }

    units.forEach((u, i) => {
        let t = document.createElement('div');
        t.id = `t-${i}`;
        t.className = `token`;
        t.style.backgroundColor = u.type === 'pc' ? "#3498db" : "#c0392b";

        if (u.icon) t.style.backgroundImage = `url('${u.icon}')`;
        else t.innerText = u.name.substring(0,2).toUpperCase();

        grid.appendChild(t);
    });

    update();
	roundStarted = false;
	startReactionPhase();
}

// High‑level class groups
const ROLE_TYPES = {
    Rogue: ["Deputy", "Arcane Trickster", "Thief", "Miner"],
    Caster: ["Bard", "Swordmage", "Shaman", "Arcane Trickster"],
	Healer: ["Shaman", "Cleric", "Paladin", "Clericbot", "Druid", "Warlock"]

};

function isRogue(role) {
    return ROLE_TYPES.Rogue.includes(role);
}

function canCast(role) {
    return ROLE_TYPES.Caster.includes(role);
}

function canHeal(role) {
    return ROLE_TYPES.Healer.includes(role);
}



function update() {
    if (isReactionPhase) return; // ⭐ Prevent UI rebuild during reactions
    const active = units[turn];
    if (!active) return;

    document.getElementById('unit-name').innerText = active.name;
    document.getElementById('unit-hp').innerText = `HP: ${active.hp}`;
    document.getElementById('unit-speed').innerText = `SPD: ${active.speed}`;

    const ring = document.getElementById('active-ring');
    ring.style.left = (active.x * 54 + 2) + 'px';
    ring.style.top = (active.y * 54 + 2) + 'px';

    units.forEach((u, i) => {
        const t = document.getElementById(`t-${i}`);
        if (t) {
            t.style.display = u.hp <= 0 ? 'none' : 'flex';
            t.style.left = (u.x * 54 + 4) + 'px';
            t.style.top = (u.y * 54 + 4) + 'px';
            t.style.opacity = u.isHiding ? "0.5" : "1";
        }
    });

    const bar = document.getElementById('action-bar');
    bar.innerHTML = '';
    createBtn(bar, "📍 Move", toggleMove, isMoving ? 'btn-move-active' : '', "move-btn");
    
	// Rogue‑type actions
	if (isRogue(active.role)) {
		if (active.isHiding) {
			createBtn(bar, "🗡️ Sneak", handleSneakAttack);
		} else {
			createBtn(bar, "⚔️ Strike", handleAttack);
			createBtn(bar, "🌫️ Hide", handleHide);
		}
	} else {
		// Default non‑rogue attack
		createBtn(bar, "⚔️ Strike", handleAttack);
	}

	// Spellcasting (only for caster roles)
	if (canCast(active.role)) {
		createBtn(bar, "✨ Spell", handleSpell);
	}
	if (canHeal(active.role)) {
		createBtn(bar, "💚 Heal", startHealTargeting);
	}


    const endBtn = document.getElementById('end-turn-btn');
    if (endBtn) endBtn.disabled = (active.type === 'monster');
    checkVictory();
}

function createBtn(parent, text, func, className = '', id = '') {
    const btn = document.createElement('button');
    btn.innerText = text;
    btn.onclick = func;
    if(className) btn.className = className;
    if(id) btn.id = id;
    if (!units[turn].hasAction && text !== "📍 Move") btn.disabled = true;
    parent.appendChild(btn);
}

function toggleMove() { isMoving = !isMoving; update(); }

function processMove(tx, ty) {
    if (!isMoving) return;
    const u = units[turn];
    const occupied = getOccupiedSquares();
    if (occupied[tx][ty]) return Bus.emit('LOG', "Space occupied!");
    let dist = Math.max(Math.abs(u.x - tx), Math.abs(u.y - ty));
    if (dist <= u.speed) { u.x = tx; u.y = ty; u.speed -= dist; update(); } 
    else Bus.emit('LOG', "Out of speed!");
}

function getOccupiedSquares() {
    const map = Array(10).fill().map(() => Array(10).fill(false));
    units.filter(u => u.hp > 0).forEach(u => { map[u.x][u.y] = true; });
    staticObstacles.forEach(obs => { map[obs.x][obs.y] = true; });
    return map;
}

function handleAttack() {
    const u = units[turn];
    if (!u.hasAction) return;

    // Find adjacent enemy
    const target = units.find(t =>
        t.type !== u.type &&
        t.hp > 0 &&
        Math.max(Math.abs(t.x - u.x), Math.abs(t.y - u.y)) <= 1
    );

    if (!target) {
        Bus.emit('LOG', "No enemy in reach.");
        return;
    }

    // --- ATTACK MODIFIER ---
    let attackMod = 0;

    if (u.type === "pc") {
        // PCs use STR or DEX (Miner rule)
        attackMod = u.stats?.str || 0;
        if (u.role === "Miner" && (u.stats?.dex > u.stats?.str)) {
            attackMod = u.stats.dex;
        }
    } else {
        // Monsters pull from JSON DB
        const m = getMonsterStats(u);
        attackMod = m?.attackMod ?? 0;
    }

    // --- RACIAL BONUS ---
    let racialBonus = 0;
    if (u.RacialEnemy && target.name.includes(u.RacialEnemy)) {
        racialBonus = 2;
        Bus.emit('LOG', `🎯 Racial Advantage!`);
    }

    // --- ROLL TO HIT ---
    const roll = Math.floor(Math.random() * 20) + 1;
    const totalToHit = roll + attackMod + racialBonus;
    const targetAC = target.ac || 10;

    const isCrit = roll === 20;
    const isHit = isCrit || (roll !== 1 && totalToHit >= targetAC);

    if (isHit) {
        // --- DAMAGE ---
        let dmg = 0;

        if (u.type === "pc") {
            // PCs: 1d6 + STR
            dmg = (Math.floor(Math.random() * 6) + 1) + attackMod;
        } else {
            // Monsters: use JSON stats
            const m = getMonsterStats(u);
            const die = m?.damageDie ?? 3;
            const bonus = m?.damageBonus ?? 0;

            dmg = (Math.floor(Math.random() * die) + 1) + bonus;
        }

        target.hp -= dmg;

        Bus.emit('LOG', `⚔️ ${u.name} hits ${target.name} for ${dmg}!`);

		if (target.hp <= 0) {
			target.x = -1;
			target.y = -1;

			Bus.emit('LOG', `💀 ${target.name} defeated.`);

			// ⭐ Award XP from monster DB
			if (target.type === "monster" && window.MONSTER_DB) {
				const template = window.MONSTER_DB[target.id];
				const xpValue = template?.xp || 0;

				battleXP += xpValue;

				Bus.emit('LOG', `✨ Gained ${xpValue} XP`);
			}
		}
    } else {
        Bus.emit('LOG', `🛡️ ${u.name} misses (${totalToHit} vs AC ${targetAC}).`);
    }

    u.hasAction = false;
    update();
}

function getMonsterStats(unit) {
    if (unit.type !== "monster") return null;
    if (!window.MONSTER_DB) return null;

    return window.MONSTER_DB[unit.id] || null;
}


function handleSpell() {
    const u = units[turn];
    const target = units.find(t => t.type !== u.type && t.hp > 0);
    if (!target || !u.hasAction) return;
    const d = Math.floor(Math.random() * 8) + 2;
    target.hp -= d; u.hasAction = false;
    Bus.emit('LOG', `🔥 Spell hits ${target.name} for ${d}.`);
    if (target.hp <= 0) { target.x = -1; target.y = -1; }
    update();
}

function handleHide() {
    const u = units[turn];
    if (!u.hasAction) return;
    u.isHiding = true; u.hasAction = false;
    Bus.emit('LOG', `${u.name} vanishes...`);
    update();
}

function handleSneakAttack() {
    const u = units[turn];
    if (!u.hasAction || !u.isHiding) return;
    const target = units.find(t => t.type !== u.type && t.hp > 0 && Math.max(Math.abs(t.x - u.x), Math.abs(t.y - u.y)) <= 1);
    if (!target) return Bus.emit('LOG', "Must be in melee.");

    const mod = Math.max(u.stats?.str || 0, u.stats?.dex || 0);
    const roll = Math.floor(Math.random() * 20) + 1;
    if (roll + mod + 2 >= (target.ac || 10)) {
        const dmg = (Math.floor(Math.random() * 6) + 1) + (Math.floor(Math.random() * 6) + 1) + mod;
        target.hp -= dmg;
        Bus.emit('LOG', `🗡️ SNEAK ATTACK! ${dmg} dmg!`);
        if (target.hp <= 0) { target.x = -1; target.y = -1; }
    } else { Bus.emit('LOG', `💨 Sneak missed!`); }
    u.isHiding = false; u.hasAction = false; update();
}

function handleHeal() {
    const u = units[turn];

    // Only healers can use this
    if (!HEALER_ROLES.includes(u.role)) {
        Bus.emit('LOG', `${u.name} cannot cast healing magic.`);
        return;
    }

    if (!u.hasAction) return;

    // Choose a target: any living PC (including self)
    const allies = units.filter(t => t.type === 'pc' && t.hp > 0);

    // If you want a UI selection later, replace this with a target picker
    const target = allies.length > 1 ? allies[0] : u;

    // Heal amount: 2–7 HP
    const heal = Math.floor(Math.random() * 6) + 3;

    const oldHP = target.hp;
    target.hp = Math.min(target.maxHp, target.hp + heal);

    u.hasAction = false;

    Bus.emit('LOG', `💚 ${u.name} heals ${target.name} for ${target.hp - oldHP} HP.`);

    update();
}

function startHealTargeting() {
    const u = units[turn];

    if (!canHeal(u.role) || !u.hasAction) return;

    isHealing = true;
    healerUnit = u;

    Bus.emit('LOG', `${u.name} is selecting a healing target...`);
}

function applyHeal(healer, target) {
    const heal = Math.floor(Math.random() * 6) + 2; // 2–7 HP
    const before = target.hp;

    target.hp = Math.min(target.maxHp, target.hp + heal);
    healer.hasAction = false;

    Bus.emit('LOG', `💚 ${healer.name} heals ${target.name} for ${target.hp - before} HP.`);

    update();
}



function startReactionPhase() {
    isReactionPhase = true;
	console.log("REACTION PHASE PCs:", units.filter(u => u.type === "pc"));

    const panel = document.getElementById('reaction-panel');
    panel.innerHTML = "";
    panel.style.display = "block";

    units.filter(u => u.type === 'pc' && u.hp > 0).forEach((pc, index) => {
        const div = document.createElement('div');
        div.className = "reaction-entry";
        div.innerText = pc.name;

        // Add reaction button based on role
        if (pc.race === "Barbarian" && !pc.usedRage) {
            createReactionBtn(div, "Rage", () => {
                pc.usedRage = true;
                Bus.emit('LOG', `${pc.name} enters a RAGE!`);
                
            });
        }

        if (pc.role === "Miner" && pc.canHide) {
            createReactionBtn(div, "Hide", () => {
                pc.isHiding = true;
                pc.canHide = false;
                Bus.emit('LOG', `${pc.name} hides in the shadows.`);
                
            });
        }

        if (pc.role === "Bard" && pc.canSing) {
            createReactionBtn(div, "Sing", () => {
                pc.canSing = false;
                Bus.emit('LOG', `${pc.name} sings an inspiring tune!`);
                
            });
        }

        panel.appendChild(div);
    });

    // Add "Continue" button
    const cont = document.createElement('button');
    cont.innerText = "Continue";
    cont.onclick = () => {
        isReactionPhase = false;
        panel.style.display = "none";
		roundStarted = true;   // ⭐ FIX HERE
        update();
    };
    panel.appendChild(cont);
}

function createReactionBtn(parent, text, func) {
    const btn = document.createElement('button');
    btn.innerText = text;
    btn.onclick = func;
    parent.appendChild(btn);
}


function endTurn() {
    isMoving = false;

    let previousTurn = turn;

    // Advance to next living unit
    let attempts = 0;
    do {
        turn = (turn + 1) % units.length;
        attempts++;
    } while (units[turn].hp <= 0 && attempts < units.length);

    const active = units[turn];

    // Detect ROUND START:
    // If we looped back to the first PC in the list
    const firstPCIndex = units.findIndex(u => u.type === 'pc');

    if (turn === firstPCIndex) {
        roundStarted = false;
		// ⭐ Reset per-round reactions
		units.forEach(pc => {
			if (pc.type !== 'pc') return;

			if (pc.role === "Miner") pc.canHide = true;
			if (pc.role === "Bard") pc.canSing = true;

			// Barbarian Rage does NOT reset per round
			// Rage resets only per fight, which you already do in init()
		});
    }

    // If round hasn't started yet → trigger reactions
    if (!roundStarted) {
        roundStarted = true;
        startReactionPhase();
        return; // Stop here until reactions are done
    }

    // Normal turn setup
    active.hasAction = true;
    active.speed = 6;

    Bus.emit('LOG', `Turn: ${active.name}`);
    update();

    if (active.type === 'monster') {
        setTimeout(monsterAI, 800);
    }
}


function monsterAI() {
    const u = units[turn];
    if (!u || u.hp <= 0) return endTurn();
    const target = units.find(t => t.type === 'pc' && t.hp > 0);
    if (target) {
        if (Math.max(Math.abs(u.x - target.x), Math.abs(u.y - target.y)) > 1) {
            u.x += (u.x < target.x ? 1 : u.x > target.x ? -1 : 0);
            u.y += (u.y < target.y ? 1 : u.y > target.y ? -1 : 0);
        } else { handleAttack(); }
    }
    setTimeout(endTurn, 1000);
}

function checkVictory() {
    const aliveMonsters = units.filter(u => u.type === 'monster' && u.hp > 0);

    if (aliveMonsters.length === 0) {

        const savedData = JSON.parse(localStorage.getItem('currentBattle')) || {};

        const xp = battleXP;
        const loot = savedData.loot || [];

        const defeated = units
            .filter(u => u.type === 'monster')
            .map(u => u.name)
            .join("<br>");

        const lootHTML = loot.length
            ? loot.map(l => `${l.qty} × ${l.item}`).join("<br>")
            : "(none)";

        const summaryHTML = `
            <strong>Defeated Enemies:</strong><br>
            ${defeated}<br><br>

            <strong>XP Gained:</strong><br>
            ${xp}<br><br>

            <strong>Spoils:</strong><br>
            ${lootHTML}
        `;

        showVictoryWindow(summaryHTML, () => {

            Bus.emit('LOG', "VICTORY!");

            localStorage.removeItem('currentBattle');

            if (window.parent) {
                window.parent.postMessage({
                    type: "BATTLE_COMPLETE",
                    result: units.filter(u => u.type === 'pc'),
                    xp: battleXP,
                    loot: loot
                }, "*");
            }
        });
    }
}

function showVictoryWindow(summary, onClose) {
    const overlay = document.createElement('div');
    overlay.id = "victory-window";
    overlay.style = `
        position: fixed;
        top: 0; left: 0;
        width: 100vw; height: 100vh;
        background: rgba(0,0,0,0.8);
        color: white;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 99999;
        font-family: sans-serif;
        text-align: center;
    `;

    overlay.innerHTML = `
        <div style="background:#222; padding:20px; border-radius:10px; width:300px;">
            <h2 style="margin-top:0;">Victory!</h2>
            <div id="victory-summary" style="margin-bottom:20px; font-size:14px;">
                ${summary}
            </div>
            <button id="victory-close" style="
                padding:10px 20px;
                background:#27ae60;
                border:none;
                color:white;
                border-radius:5px;
                cursor:pointer;
                font-size:16px;
            ">Continue</button>
        </div>
    `;

    document.body.appendChild(overlay);

    document.getElementById("victory-close").onclick = () => {
        overlay.remove();
        if (onClose) onClose();
    };
}

console.log("MONSTER_DB:", window.MONSTER_DB);


Bus.on('LOG', (msg) => {
    const l = document.getElementById('log');
    const entry = document.createElement('div');
    entry.innerText = `> ${msg}`;
    l.prepend(entry);
});

init();
</script>
</body>
</html>
