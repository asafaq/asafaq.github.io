<!DOCTYPE html>
<html>
<head>
    <title>D&D Mobile Virtual Table Top: Action Economy</title>
    <meta name="viewport" content="width=540, user-scalable=no" charset="UTF-8">
    <style>
        body { margin: 0; background: #121212; color: #eee; display: flex; justify-content: center; font-family: 'Segoe UI', sans-serif; }
        #screen { width: 540px; height: 960px; background: #222; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 0 50px #000; }
        
        #grid { width: 540px; height: 540px; position: relative; background-color: #333; background-size: 54px 54px, cover; border-bottom: 2px solid #444; transition: 0.3s; }
        #log { height: 140px; background: #111; padding: 15px; overflow-y: auto; color: #00ff00; font-family: monospace; border-bottom: 2px solid #444; display: flex; flex-direction: column-reverse; }
        #controls { flex: 1; padding: 20px; background: #2c2c2c; display: flex; flex-direction: column; justify-content: space-between; }

        .grid-overlay { position: absolute; width: 100%; height: 100%; background-image: linear-gradient(rgba(255,255,255,0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.1) 1px, transparent 1px); background-size: 54px 54px; pointer-events: none; z-index: 1; }
        .cell { width: 54px; height: 54px; float: left; z-index: 2; position: relative; cursor: pointer; }
		.token { width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; position: absolute; z-index: 3; transition: 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28); pointer-events: none; box-shadow: 0 4px 10px rgba(0,0,0,0.5); font-size: 14px; color: white; text-shadow: 1px 1px 2px #000; background-size: cover; background-position: center; background-repeat: no-repeat; border: 1px solid white; }
        .active-ring { position: absolute; width: 50px; height: 50px; border: 3px solid #f1c40f; border-radius: 50%; transition: 0.3s; pointer-events: none; z-index: 2; box-shadow: 0 0 15px #f1c40f; }

        .status-bar { background: #3d3d3d; padding: 15px; border-radius: 8px; border-left: 8px solid #3498db; margin-bottom: 10px; }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        button { padding: 18px; border-radius: 6px; border: none; font-weight: bold; background: #444; color: white; cursor: pointer; font-size: 13px; text-transform: uppercase; transition: 0.2s; }
        button:disabled { opacity: 0.3; filter: grayscale(1); cursor: not-allowed; }
        .btn-move-active { background: #27ae60 !important; box-shadow: 0 0 10px #27ae60; }
        .btn-util { background: #34495e !important; font-size: 11px; padding: 10px; text-transform: none; }
    </style>
</head>
<body>

<div id="screen">
    <div id="grid">
        <div class="grid-overlay"></div>
        <div id="active-ring" class="active-ring"></div>
    </div>
    <div id="log">> Battle Ready.</div>
    <div id="controls">
        <div class="status-bar">
            <div style="display:flex; justify-content:space-between; align-items: center;">
                <h3 id="turn-name" style="margin:0">Hero</h3>
                <div style="display:flex; gap: 5px;">
                    <button class="btn-util" onclick="StateStore.save()">💾 Save</button>
                    <button class="btn-util" onclick="StateStore.load()">📂 Load</button>
                </div>
            </div>
            <p id="stats" style="margin:5px 0 0 0; color:#bbb; font-weight: bold; font-size: 13px;">HP: -- | SPEED: -- | ACTION: [READY]</p>
        </div>
        <div class="btn-group">
            <button id="move-btn" onclick="toggleMove()">📍 Move</button>
            <button id="atk-btn" onclick="handleAttack()">⚔️ Attack</button>
            <button id="spell-btn" onclick="handleSpell()">🔥 Spell</button>
            <button id="map-btn" onclick="changeMap()">🗺️ Map</button>
        </div>
        <button onclick="endTurn()" style="background:#d35400; width:100%; border: 1px solid #e67e22;">END TURN</button>
    </div>
</div>

<script>
// --- 1. EVENT BUS ---
const Bus = {
    events: {},
    on(event, cb) { if(!this.events[event]) this.events[event] = []; this.events[event].push(cb); },
    emit(event, data) { if(this.events[event]) this.events[event].forEach(cb => cb(data)); }
};

// --- 2. MEMORY PERSISTENCE ---
const StateStore = {
    snapshot: null,
    save() {
        this.snapshot = { units: JSON.parse(JSON.stringify(units)), turn: turn, map: mapIdx };
        Bus.emit('LOG', "Snapshot stored in memory.");
    },
    load() {
        if (!this.snapshot) return Bus.emit('LOG', "No save found.");
        units = JSON.parse(JSON.stringify(this.snapshot.units));
        turn = this.snapshot.turn; mapIdx = this.snapshot.map;
        Bus.emit('LOG', "State restored.");
        update();
    }
};

// --- 3. UTILITIES ---

let staticObstacles = []; // Set this in init() from the payload

function getOccupiedSquares() {
    const map = Array(10).fill().map(() => Array(10).fill(false));
    
    // 1. Mark Units (Players & Monsters)// Inside your init() function in battle.html
	units.forEach((u, i) => {
		let t = document.createElement('div');
		t.id = `t-${i}`;
		t.className = `token`;
		
		// Fallback background color if image doesn't load
		t.style.backgroundColor = u.color || (u.type === 'pc' ? "#3498db" : "#c0392b");

		if (u.icon) {
			// Apply the monster or PC icon
			t.style.backgroundImage = `url('${u.icon}')`;
			t.innerText = ""; // Clear text initials if there is an image
		} else {
			// If no icon, show the first two letters of the name
			t.innerText = u.name.substring(0, 2).toUpperCase();
		}
		
		grid.appendChild(t);
	});

    
    // 2. Mark Static Obstacles (Walls/Rocks)
    staticObstacles.forEach(obs => {
        if (obs.x >= 0 && obs.x < 10 && obs.y >= 0 && obs.y < 10) {
            map[obs.x][obs.y] = true;
        }
    });
    
    return map;
}

// --- 4. DATA & CORE (Dynamic) ---
let units = []; // Start empty
let turn = 0, isMoving = false, mapIdx = 0;
const mapUrls = {
    "green_1": "assets/missions/combat_green_1.png",
    "green_2": "assets/missions/combat_green_1.png",
    "green_3": "assets/missions/combat_green_1.png",
    "default": "assets/missions/combat_green_1.png"
};

function init() {
    const savedData = localStorage.getItem('currentBattle');
    if (!savedData) {
        Bus.emit('LOG', "ERR: No battle data found!");
        return;
    }

    const data = JSON.parse(savedData);
    console.log("Battle Data Loaded:", data);

    // 1. Map Handling
    const missionId = data.missionId || "default";
    const bgUrl = mapUrls[missionId] || mapUrls["default"];
    const grid = document.getElementById('grid');

    if (bgUrl && bgUrl !== "undefined") {
        grid.style.backgroundImage = `url('${bgUrl}')`;
        grid.style.backgroundSize = "cover";
        grid.style.backgroundPosition = "center";
    } else {
        console.error("Map URL is missing for mission:", missionId);
    }

    // 2. Data Unpacking
    staticObstacles = data.obstacles || [];
    units = [...data.party, ...data.monsters];

    // 3. Grid Construction
    grid.innerHTML = ''; // Clear grid before building
    for (let i = 0; i < 100; i++) {
        let cell = document.createElement('div');
        cell.className = 'cell';
        let cx = i % 10, cy = Math.floor(i / 10);

        // Visualize Obstacles
        if (staticObstacles.some(o => o.x === cx && o.y === cy)) {
            cell.style.backgroundColor = "rgba(0,0,0,0.5)";
        }

        cell.onclick = () => processMove(cx, cy);
        grid.appendChild(cell);
    }

    // 4. Token Construction
    units.forEach((u, i) => {
        let t = document.createElement('div');
        t.id = `t-${i}`;
        t.className = `token`;
        t.style.backgroundColor = u.color || "#3498db";

        if (u.icon) {
            const img = new Image();
            img.src = u.icon;
            img.onload = () => {
                t.style.backgroundImage = `url('${u.icon}')`;
                t.innerText = ""; 
            };
            img.onerror = () => {
                t.innerText = u.name.substring(0,2).toUpperCase();
            };
        } else {
            t.innerText = u.name.substring(0,2).toUpperCase();
        }
        grid.appendChild(t);
    });

    update();
}

function update() {
    const active = units[turn];
    if (!active) return;

    // 1. Sync Tokens
    units.forEach((u, i) => {
        const t = document.getElementById(`t-${i}`);
        
        // THE FIX: Check if the token exists before touching its style
        if (t) {
            t.style.left = (u.x * 54 + 4) + 'px'; 
            t.style.top = (u.y * 54 + 4) + 'px';
            t.style.display = u.hp > 0 ? 'flex' : 'none';
            t.style.opacity = "1"; 
        }
    });

    // 2. Sync UI (Check if these elements exist too!)
    const turnName = document.getElementById('turn-name');
    if (turnName) {
        turnName.innerText = active.name;
        turnName.style.color = active.color;
    }

    const stats = document.getElementById('stats');
    if (stats) {
        const actionLabel = active.hasAction ? "[READY]" : "[SPENT]";
        stats.innerText = `HP: ${active.hp}/${active.maxHp} | SPEED: ${active.speed*5}FT | ACTION: ${actionLabel}`;
    }

    const ring = document.getElementById('active-ring');
    if (ring) {
        ring.style.left = (active.x * 54 + 2) + 'px';
        ring.style.top = (active.y * 54 + 2) + 'px';
    }

    // 3. Button States
    const atkBtn = document.getElementById('atk-btn');
    const spellBtn = document.getElementById('spell-btn');
    if (atkBtn) atkBtn.disabled = !active.hasAction;
    if (spellBtn) spellBtn.disabled = !active.hasAction;

    checkVictory(); 
}

// --- 5. LOGIC ---
Bus.on('LOG', (msg) => {
    const l = document.getElementById('log');
    const entry = document.createElement('div');
    entry.innerHTML = `> ${msg}`;
    l.prepend(entry);
});

function toggleMove() { 
    isMoving = !isMoving; 
    document.getElementById('move-btn').className = isMoving ? 'btn-move-active' : ''; 
}

function processMove(tx, ty) {
    if (!isMoving) return;
    const u = units[turn];
    const occupied = getOccupiedSquares();
    
    if (occupied[tx][ty]) return Bus.emit('LOG', "Space occupied!");

    let dist = Math.max(Math.abs(u.x - tx), Math.abs(u.y - ty));
    if (dist <= u.speed) {
        u.x = tx; u.y = ty; u.speed -= dist;
        update();
    } else Bus.emit('LOG', "Out of speed!");
}

function handleAttack() {
    const u = units[turn];
    if (!u.hasAction) return;

    const target = units.find(t => t.type !== u.type && t.hp > 0 && Math.max(Math.abs(t.x - u.x), Math.abs(t.y - u.y)) <= 1);
    if (target) {
        const d = Math.floor(Math.random() * 10) + 5;
        target.hp -= d;
        u.hasAction = false; // Spend Action
        Bus.emit('LOG', `⚔️ ${u.name} strikes ${target.name} for ${d}.`);
        if(target.hp <= 0) Bus.emit('LOG', `💀 ${target.name} defeated.`);
        update();
    } else Bus.emit('LOG', "No enemy in reach.");
}

function handleSpell() {
    const u = units[turn];
    if (!u.hasAction) return;
    const target = units.find(t => t.type !== u.type && t.hp > 0);
    if (target) {
        const d = Math.floor(Math.random() * 8) + 2;
        target.hp -= d;
        u.hasAction = false; // Spend Action
        Bus.emit('LOG', `🔥 ${u.name} casts Firebolt at ${target.name} for ${d}.`);
        update();
    }
}

function changeMap() { mapIdx = (mapIdx + 1) % mapUrls.length; update(); }

function endTurn() {
    isMoving = false; 
    document.getElementById('move-btn').className = '';
    
    // Refresh for next turn
    units[turn].speed = units[turn].maxMove;
    units[turn].hasAction = true; 

    turn = (turn + 1) % units.length;
    if (units[turn].hp <= 0) return endTurn();
    
    update();
    if (units[turn].type === 'monster') {
        Bus.emit('LOG', `--- ${units[turn].name.toUpperCase()}'S TURN ---`);
        setTimeout(monsterAI, 800);
    }
}

function monsterAI() {
    let u = units[turn], target = units.find(t => t.type === 'pc' && t.hp > 0);
    if (target) {
        const occ = getOccupiedSquares();
        let nX = u.x, nY = u.y;
        if (u.x < target.x) nX++; else if (u.x > target.x) nX--;
        if (u.y < target.y) nY++; else if (u.y > target.y) nY--;
        
        // Move if not walking on target
        if (!(nX === target.x && nY === target.y) && !occ[nX][nY]) { 
            u.x = nX; u.y = nY; update(); 
        }
        
        // Attack if close
        if (Math.max(Math.abs(u.x - target.x), Math.abs(u.y - target.y)) <= 1) {
            setTimeout(handleAttack, 400);
        }
    }
    setTimeout(endTurn, 1000);
}

function checkVictory() {
    const monstersAlive = units.filter(u => u.type === 'monster' && u.hp > 0);
    
	if (monstersAlive.length === 0) {
			Bus.emit('LOG', "VICTORY! Transmitting results...");
			
			// 1. Mark that we are returning from a battle
			localStorage.setItem('returningFromBattle', 'true');

			const resultData = {
				type: "BATTLE_COMPLETE",
				result: units.filter(u => u.type === 'pc')
			};

			const target = window.opener || window.parent;
			target.postMessage(resultData, "*"); 

			setTimeout(() => { 
				window.location.href = "index.html"; 
			}, 2000);
		}
}


init();
</script>
</body>
</html>
