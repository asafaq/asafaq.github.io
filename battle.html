<!DOCTYPE html>
<html>
<head>
    <title>D&D Virtual Table Top</title>
    <meta name="viewport" content="width=540, user-scalable=no" charset="UTF-8">
<style>
    body { margin: 0; background: #121212; color: #eee; display: flex; justify-content: center; font-family: 'Segoe UI', sans-serif; min-height: 100vw ; overflow: auto; }
    #screen { width: 540px; height: 960px; background: #222; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 0 50px #000; position: relative; }
    #grid { width: 540px; height: 540px; position: relative; background-color: #333; border-bottom: 2px solid #444; flex-shrink: 0; overflow: hidden; background-size: cover; background-position: center; }
    #log { height: 140px; background: #111; padding: 15px; overflow-y: auto; color: #00ff00; font-family: monospace; border-bottom: 2px solid #444; display: flex; flex-direction: column-reverse; box-sizing: border-box; flex-shrink: 0; }
    #controls { position:relative ; display: flex; flex-direction: row; flex: 1; background: #1a1a1a; padding: 10px; gap: 10px; align-items: stretch; box-sizing: border-box; }
    #stats-panel { width: 85px; display: flex; flex-direction: column; justify-content: center; background: #2c3e50; border-radius: 4px; padding: 8px; font-size: 0.7rem; color: white; flex-shrink: 0; border-left: 4px solid #3498db; box-sizing: border-box; }
    #stats-panel strong { display: block; margin-bottom: 2px; color: #f1c40f; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .btn-group { display: grid; flex: 1; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(2, 1fr); gap: 8px; min-width: 0; }
    .btn-group button { width: 100%; height: 100%; font-size: 0.85rem; background: #444; color: white; border: 1px solid #555; border-radius: 4px; cursor: pointer; }
    #end-turn-btn { width: 45px; background: #d35400; color: white; font-weight: bold; writing-mode: vertical-lr; text-orientation: upright; border: none; border-radius: 4px; flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; letter-spacing: 2px; font-size: 0.8rem; }
    .token { width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; position: absolute; z-index: 3; transition: 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28); pointer-events: none; box-shadow: 0 4px 10px rgba(0,0,0,0.5); font-size: 14px; color: white; border: 2px solid white; background-size: cover; background-position: center; }
    .active-ring { position: absolute; width: 50px; height: 50px; border: 3px solid #f1c40f; border-radius: 50%; transition: 0.3s; pointer-events: none; z-index: 2; box-shadow: 0 0 15px #f1c40f; }
    .grid-overlay { position: absolute; width: 100%; height: 100%; background-image: linear-gradient(rgba(255,255,255,0.35) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.1) 1px, transparent 1px); background-size: 54px 54px; pointer-events: none; z-index: 10; }
    .cell { width: 54px; height: 54px; float: left; z-index: 1; position: relative; cursor: pointer; }
	.cell.obstacle {     background-color: rgba(0,0,0,0.6); }
    .btn-move-active { background-color: #27ae60 !important; border: 2px solid white !important; }
    button:disabled { opacity: 0.4; filter: grayscale(1); cursor: not-allowed; }
.reaction-panel {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #121214; /* Solid color matches theme and obscures the active skill keys */
    padding: 12px;
    display: none;
    color: white;
    z-index: 999; /* Higher priority layer to step completely over the action button map */
    box-sizing: border-box;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
}

.reaction-entry {
    margin-bottom: 10px;
}

/* The Restyled Reaction Blocker Panel */
.reaction-overlay-panel {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: #121214; /* Match your app's dark dashboard or UI theme */
    z-index: 999; /* Sits completely on top of action buttons */
    
    /* Center the reaction contents beautifully */
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 16px;
    box-sizing: border-box;
    border-top: 2px solid #3a3a42;
}

/* Optional styling to make the notification stand out */
.reaction-title {
    color: #ffd166;
    font-size: 1.1rem;
    font-weight: bold;
    margin: 0;
    text-transform: uppercase;
    letter-spacing: 1px;
}

</style>
</head>
<body>

<div id="screen">
    <div id="grid">
        <div class="grid-overlay"></div>
        <div id="active-ring" class="active-ring"></div>
    </div>
    <div id="log">> Battle Initialized.</div>
	<div id="reaction-panel" class="reaction-panel"></div>
    <div id="controls">
        <div id="stats-panel">
            <strong id="unit-name">Name</strong>
            <span id="unit-hp">HP: 0</span>
            <span id="unit-speed">SPD: 0</span>
        </div>
        <div class="btn-group" id="action-bar"></div>
        <button id="end-turn-btn" onclick="endTurn()">END</button>
    </div>
</div>

<script>
const Bus = {
    events: {},
    on(event, cb) { if(!this.events[event]) this.events[event] = []; this.events[event].push(cb); },
    emit(event, data) { if(this.events[event]) this.events[event].forEach(cb => cb(data)); }
};

let staticObstacles = [], units = [], turn = 0, isMoving = false; battleXP = 0; isReactionPhase = false; roundStarted = false; isHealing = false; healerUnit = null; isCastingSpell = false; spellCaster = null; selectedSpell = null; pendingSpells = []; victoryShown = false; isRangedTargeting = false; rangedShooter = null; isMeleeTargeting = false; meleeAttacker = null; isSneakTargeting = false; sneakAttacker = null;

const STRDEX_TABLE = {
  str: ['warrior', 'fighter', 'barbarian', 'paladin', 'cleric', 'ranger', 'monk', 'shaman', 'swordmage', 'brute', 'squire', 'paladin', 'bouncer', 'fallen paladin', 'clericbot', 'druid', 'warlock'],
  dex: ['thief', 'rogue', 'bard', 'deputy', 'miner', 'arcane trickster']
};

const firstPCIndex = units.findIndex(u => u.type === "pc");

function init() {

    const savedData = localStorage.getItem('currentBattle');
    if (!savedData) return Bus.emit('LOG', "ERR: No battle data found!");

    const data = JSON.parse(savedData);

    // FIXED: use data.monsterDB, not savedData.monsterDB
    window.MONSTER_DB = data.monsterDB;

    const grid = document.getElementById('grid');
    staticObstacles = data.obstacles || [];
    
    const mapUrls = {
        "green_1": "assets/missions/combat_green_1.png",
        "default": "assets/missions/combat_green_1.png"
    };

    const bgUrl = mapUrls[data.missionId] || mapUrls["default"];
    grid.style.backgroundImage = `url('${bgUrl}')`;

	units = [
		...data.party.map(p => ({
			...p,
			type: 'pc',
			tempHp: p.tempHp || 0,
			speed: 6,
			maxSpeed: 6,
			hasAction: true,
			isConcentrating: false,
			isHiding: p.isHiding || false,
			isRaging: p.isRaging || false,
			usedRage: p.usedRage || false,
			canSing: p.canSing ?? true,
			canHide: p.canHide ?? true,
			maxHp: p.maxHp || p.hp,
			// ⭐ Preserve bard song state
			hitBonus: p.hitBonus || 0,
			damageBonus: p.damageBonus || 0,
			isSinging: p.isSinging || false,
		})),
		
        ...data.monsters.map(m => ({
            ...m,
            type: 'monster',
            speed: 6,
            maxSpeed: 6,
            hasAction: true,
            maxHp: m.hp
        }))
    ];

	// Apply STR/DEX bonuses to all units (PCs only)
	for (let i = 0; i < units.length; i++) {
		if (units[i].type === 'pc') {
			units[i] = applyStrDexAttackBonus(units[i]);
		}
	}

	// ⭐ Bard song fade: runs at the start of the Bard's next turn
	const active = units[turn];
    grid.innerHTML = '<div class="grid-overlay"></div><div id="active-ring" class="active-ring"></div>';

    for (let i = 0; i < 100; i++) {
        let cell = document.createElement('div');
        cell.className = 'cell';
        let cx = i % 10, cy = Math.floor(i / 10);
		    // ⭐ Mark obstacles
		if (staticObstacles.some(o => o.x === cx && o.y === cy)) {
			cell.classList.add("obstacle");
		}
		cell.onclick = () => {
			// ⭐ HEALING TARGET SELECTION
			if (isHealing) {
				const target = units.find(t =>
					t.x === cx &&
					t.y === cy &&
					t.hp > 0 &&
					t.type === "pc"
				);

				if (!target) {
					Bus.emit('LOG', "Invalid healing target.");
					isHealing = false;
					healerUnit = null;
					return;
				}

				applyHeal(healerUnit, target);

				isHealing = false;
				healerUnit = null;
				return;
			}
			// ⭐ SPELL TARGETING
			if (isCastingSpell) {
				const target = units.find(t =>
					t.x === cx &&
					t.y === cy &&
					t.hp > 0 &&
					t.type !== spellCaster.type
				);

				if (!target) {
					Bus.emit('LOG', "Invalid spell target.");
					isCastingSpell = false;
					spellCaster = null;
					selectedSpell = null;
					return;
				}

				// Queue the spell for end-of-round resolution
				pendingSpells.push({ caster: spellCaster, target, spell: selectedSpell });
				// ⭐ Start concentration
				spellCaster.isConcentrating = true

				Bus.emit('LOG', `${spellCaster.name} is cast ${selectedSpell} at ${target.name}!`);

				spellCaster.hasAction = false;

				// Exit spell mode
				isCastingSpell = false;
				spellCaster = null;
				selectedSpell = null;

				update();
				return;
			}

			// ⭐ RANGED TARGETING
			if (isRangedTargeting) {
				const target = units.find(t =>
					t.x === cx &&
					t.y === cy &&
					t.hp > 0 &&
					t.type !== rangedShooter.type
				);

				if (!target) {
					Bus.emit('LOG', "Invalid ranged target.");
					isRangedTargeting = false;
					rangedShooter = null;
					return;
				}

				handleRangedAttack(rangedShooter, target);

				isRangedTargeting = false;
				rangedShooter = null;
				return;
			}

			// ⭐ MELEE TARGETING
			// Inside your init() function cell click handler:
			if (isMeleeTargeting) {
				const target = units.find(t => t.x === cx && t.y === cy && t.hp > 0 && t.type !== meleeAttacker.type);
				if (!target) {
					Bus.emit('LOG', "Invalid melee target.");
					isMeleeTargeting = false;
					meleeAttacker = null;
					return;
				}
				
				// ⭐ CHANGE: Calculate distance using Math.max to allow diagonal range checks
				const dx = Math.abs(target.x - meleeAttacker.x);
				const dy = Math.abs(target.y - meleeAttacker.y);
				const distance = Math.max(dx, dy); 

				if (distance !== 1) {
					Bus.emit('LOG', "Target is not in melee range.");
					isMeleeTargeting = false;
					meleeAttacker = null;
					return;
				}
				
				handleAttack(meleeAttacker, target);
				isMeleeTargeting = false;
				meleeAttacker = null;
				return;
			}

			// Add this inside cell.onclick alongside your other targeting modes:
			if (isSneakTargeting) {
				const target = units.find(t => t.x === cx && t.y === cy && t.hp > 0 && t.type !== sneakAttacker.type);
				if (!target) {
					Bus.emit('LOG', "Invalid sneak attack target.");
					isSneakTargeting = false;
					sneakAttacker = null;
					return;
				}

				// Range check (using Math.max to respect your diagonal rule)
				const dx = Math.abs(target.x - sneakAttacker.x);
				const dy = Math.abs(target.y - sneakAttacker.y);
				if (Math.max(dx, dy) !== 1) {
					Bus.emit('LOG', "Target is out of sneak attack range.");
					isSneakTargeting = false;
					sneakAttacker = null;
					return;
				}

				handleSneakAttack(target);
				isSneakTargeting = false;
				sneakAttacker = null;
				return;
			}

			// ⭐ NORMAL CLICK BEHAVIOR
			processMove(cx, cy);
		};

		
		
		
        grid.appendChild(cell);
    }

    units.forEach((u, i) => {
        let t = document.createElement('div');
        t.id = `t-${i}`;
        t.className = `token`;
        t.style.backgroundColor = u.type === 'pc' ? "#3498db" : "#c0392b";

        if (u.icon) t.style.backgroundImage = `url('${u.icon}')`;
        else t.innerText = u.name.substring(0,2).toUpperCase();

        grid.appendChild(t);
    });

    update();
	roundStarted = false;
	startReactionPhase();
}

/**
 * Applies the appropriate STR or DEX modifier to hitBonus and damageBonus
 * based on the character's role.
 */
function applyStrDexAttackBonus(unit) {
  if (!unit?.role || unit.type !== 'pc') return unit;

  // Normalize role (case-insensitive)
  const role = (unit.role || '').toLowerCase().trim();

  let modifier = 0;

  if (STRDEX_TABLE.str.includes(role)) {
    modifier = unit.stats?.str || 0;           // ← from stats.str
  } 
  else if (STRDEX_TABLE.dex.includes(role)) {
    modifier = unit.stats?.dex || 0;           // ← from stats.dex
  }

  if (modifier === 0) return unit;

  return {
    ...unit,
    hitBonus: (unit.hitBonus || 0) + modifier,
    damageBonus: (unit.damageBonus || 0) + modifier,
  };
}

function applyDamage(target, amount) {
    let dmg = amount;

    // ⭐ 1. Temp HP absorbs damage first
    if (target.tempHp && target.tempHp > 0) {
        const absorbed = Math.min(target.tempHp, dmg);
        target.tempHp -= absorbed;
        dmg -= absorbed;

        Bus.emit('LOG', `🛡️ ${target.name}'s temp HP absorbs ${absorbed} damage.`);

        // If all damage was absorbed, stop here
        if (dmg <= 0) {
            update();
            return;
        }
    }

    // ⭐ 2. Remaining damage hits real HP
    target.hp -= dmg;
    Bus.emit('LOG', `💥 ${target.name} takes ${dmg} damage.`);

    // ⭐ 3. If HP drops to 0 or below, remove from board
    if (target.hp <= 0) {
        target.hp = 0;
        target.x = -1;
        target.y = -1;
		awardFoeDefeat(target);
        Bus.emit('LOG', `☠️ ${target.name} falls!`);
    }

    // ⭐ 4. Concentration breaks on ANY real HP damage
    if (target.isConcentrating) {
        target.isConcentrating = false;
        Bus.emit('LOG', `💥 ${target.name} loses concentration!`);
    }

    update();
}




// High‑level class groups
const ROLE_TYPES = {
    Rogue: ["Deputy", "Arcane Trickster", "Thief", "Miner"],
    Caster: ["Bard", "Swordmage", "Shaman", "Arcane Trickster"],
	Healer: ["Shaman", "Cleric", "Paladin", "Clericbot", "Druid", "Warlock"]

};

function isRogue(role) {
    return ROLE_TYPES.Rogue.includes(role);
}

function canCast(role) {
    return ROLE_TYPES.Caster.includes(role);
}

function canHeal(role) {
    return ROLE_TYPES.Healer.includes(role);
}

function update() {
    if (isReactionPhase) return; 
    const active = units[turn];
    if (!active) return;

    // 1. ALWAYS update position rings and token visibility for both PCs and Monsters
    const ring = document.getElementById('active-ring');
    ring.style.left = (active.x * 54 + 2) + 'px';
    ring.style.top = (active.y * 54 + 2) + 'px';

    units.forEach((u, i) => {
        const t = document.getElementById(`t-${i}`);
        if (t) {
            t.style.display = u.hp <= 0 ? 'none' : 'flex';
            t.style.left = (u.x * 54 + 4) + 'px';
            t.style.top = (u.y * 54 + 4) + 'px';
            t.style.opacity = u.isHiding ? "0.5" : "1";
        }
    });

    // 🛑 STOP UI REBUILD HERE IF IT IS A MONSTER'S TURN
    // This replaces the old "if (active.type === 'monster') return;" that was placed too high up
    const bar = document.getElementById('action-bar');
    const endBtn = document.getElementById('end-turn-btn');
    
    if (active.type === "monster") {
        bar.innerHTML = '';
        if (endBtn) endBtn.disabled = true;
        checkVictory();
        return; 
    }

    // 2. Human Player character UI rebuild follows normally...
    if (endBtn) endBtn.disabled = false;
    document.getElementById('unit-name').innerText = active.name;
    let hpText = `HP: ${active.hp}`;
    if (active.tempHp && active.tempHp > 0) {
        hpText += `  🛡️ ${active.tempHp}`;
    }
    document.getElementById('unit-hp').innerText = hpText;
    document.getElementById('unit-speed').innerText = `SPD: ${active.speed}`;

    const hitBonus = active.hitBonus || 0;
    const dmgBonus = active.damageBonus || 0;
    let hitEl = document.getElementById('unit-hitBonus') || document.createElement('span');
    let dmgEl = document.getElementById('unit-damageBonus') || document.createElement('span');
    hitEl.id = 'unit-hitBonus'; dmgEl.id = 'unit-damageBonus';
    document.getElementById('stats-panel').appendChild(hitEl);
    document.getElementById('stats-panel').appendChild(dmgEl);
    hitEl.style.display = hitBonus !== 0 ? "block" : "none";
    dmgEl.style.display = dmgBonus !== 0 ? "block" : "none";
    if (hitBonus !== 0) hitEl.innerText = `HIT: ${hitBonus > 0 ? "+" : ""}${hitBonus}`;
    if (dmgBonus !== 0) dmgEl.innerText = `DMG: ${dmgBonus > 0 ? "+" : ""}${dmgBonus}`;

    bar.innerHTML = '';
    createBtn(bar, "📍 Move", toggleMove, isMoving ? 'btn-move-active' : '', "move-btn");
    
    if (active.race === "Barbarian" && active.isRaging && active.rageTurnsActive >= 3) {
        createBtn(bar, "End Rage", handleEndRage);
    }
    if (active.role === "Bard") {
        createBtn(bar, "🏹 Crossbow", startRangedTargeting);
    }
    if (isRogue(active.role)) {
        if (active.isHiding) {
            createBtn(bar, "🗡️ Sneak", startSneakTargeting);
        } else {
            createBtn(bar, "⚔️ Strike", startMeleeTargeting);
            createBtn(bar, "🌫️ Hide", handleHide);
        }
    } else {
        createBtn(bar, "⚔️ Strike", startMeleeTargeting);
    }
    if (canCast(active.role) && !active.isSinging && !active.isRaging) {
        createBtn(bar, "✨ Spell", handleSpell);
    }
    if (canHeal(active.role) && !active.isRaging) {
        createBtn(bar, "💚 Heal", startHealTargeting);
    }

    checkVictory();
}

function startRangedTargeting() {
    const u = units[turn];
    if (!u.hasAction) return;

    isRangedTargeting = true;
    rangedShooter = u;

    Bus.emit('LOG', `${u.name} aims their crossbow... select a target`);
}

function createBtn(parent, text, func, className = '', id = '') {
    const btn = document.createElement('button');
    btn.innerText = text;
    btn.onclick = func;
    if(className) btn.className = className;
    if(id) btn.id = id;
    if (!units[turn].hasAction && text !== "📍 Move") btn.disabled = true;
    parent.appendChild(btn);
}

function toggleMove() { isMoving = !isMoving; update(); }

function processMove(tx, ty, force = false) {
    if (!isMoving && !force) return;

    const u = units[turn];
    const occupied = getOccupiedSquares();
    if (occupied[tx][ty]) return Bus.emit('LOG', "Space occupied!");

    let dist = Math.max(Math.abs(u.x - tx), Math.abs(u.y - ty));
    if (dist <= u.speed) {
        u.x = tx;
        u.y = ty;
        u.speed -= dist;
        update();
    } else {
        Bus.emit('LOG', "Out of speed!");
    }
}

function getOccupiedSquares() {
    const map = Array(10).fill().map(() => Array(10).fill(false));
    units.filter(u => u.hp > 0).forEach(u => { map[u.x][u.y] = true; });
    staticObstacles.forEach(obs => { map[obs.x][obs.y] = true; });
    return map;
}

function handleAttack(attacker, target) {
    if (!attacker.hasAction) return;
    if (!target || target.hp <= 0) return;

    // --- ATTACK MODIFIER ---
    let hitMod = 0;

    if (attacker.type === "pc") {
        hitMod = attacker.stats?.str || 0;
        if (attacker.role === "Miner" && (attacker.stats?.dex > attacker.stats?.str)) {
            hitMod = attacker.stats.dex;
        }
    } else {
        const m = getMonsterStats(attacker);
        hitMod = m?.hitMod ?? 0;
    }

    // --- RACIAL BONUS ---
    let racialBonus = 0;
    if (attacker.RacialEnemy && target.name.includes(attacker.RacialEnemy)) {
        racialBonus = 2;
        Bus.emit('LOG', `🎯 Racial Advantage!`);
    }

    // --- ROLL TO HIT ---
    const roll = Math.floor(Math.random() * 20) + 1;
    const totalToHit = roll + hitMod + racialBonus + (attacker.hitBonus || 0);

    const targetAC = target.ac || 10;

    const isCrit = roll === 20;
    const isHit = isCrit || (roll !== 1 && totalToHit >= targetAC);

    Bus.emit('LOG', `${attacker.name} attacks ${target.name}! (Roll: ${roll} + ${hitMod} + ${attacker.hitBonus || 0})`);

    if (isHit) {
        // --- DAMAGE ---
        let dmg = 0;

        if (attacker.type === "pc") {
            dmg = (Math.floor(Math.random() * 6) + 1) + hitMod + (attacker.damageBonus || 0);
        } else {
            const m = getMonsterStats(attacker);
            const die = m?.damageDie ?? 3;
            const bonus = m?.damageBonus ?? 0;

            dmg = (Math.floor(Math.random() * die) + 1) + bonus;
        }

        applyDamage(target, dmg);

        Bus.emit('LOG', `⚔️ ${attacker.name} hits ${target.name} for ${dmg}!`);

        if (target.hp <= 0) {
            target.x = -1;
            target.y = -1;

            Bus.emit('LOG', `💀 ${target.name} defeated.`);

        }
    } else {
        Bus.emit('LOG', `🛡️ ${attacker.name} misses (${totalToHit} vs AC ${targetAC}).`);
    }

    attacker.hasAction = false;

    // ⭐ FIX: Only trigger UI updates if a human player is acting.
    // Monsters will be updated as a batch when their AI sequence finishes.
    if (attacker.type === "pc") {
        update();
    }
}

function getMonsterStats(unit) {
    if (unit.type !== "monster") return null;
    if (!window.MONSTER_DB) return null;

    return window.MONSTER_DB[unit.id] || null;
}

function handleSpell() {
    const u = units[turn];

    if (!canCast(u.role) || !u.hasAction) return;

    isCastingSpell = true;
    spellCaster = u;
    selectedSpell = "Magic Missile"; // your only spell for now

    Bus.emit('LOG', `${u.name} begins chanting the incantations to cast ${selectedSpell}... please select a target`);
}

function handleRage(u) {

    // Only Barbarians can Rage
    if (u.race !== "Barbarian") {
        Bus.emit('LOG', `${u.name} cannot Rage.`);
        return;
    }

    // Already raging?
    if (u.isRaging) {
        Bus.emit('LOG', `${u.name} is already raging.`);
        return;
    }

    // Only once per battle
    if (u.usedRage) {
        Bus.emit('LOG', `${u.name} has already used Rage this battle.`);
        return;
    }

    // ⭐ Rage is a free action
    u.usedRage = true;
    u.isRaging = true;
	u.damageBonus += 2;
	u.rageTurnsActive = 1;   // ⭐ Start counting turns
	
    // ⭐ Temp HP = 5x + 5 (x = level)
	console.log(u, "level", u.level)
    const lvl = u.level || 1;
    u.tempHp = (5 * lvl) + 5;

    Bus.emit('LOG', `💢 Primal spirit of might imbues in ${u.name}`);

    update();
}

function handleEndRage() {
    const u = units[turn];
    if (!u.isRaging) return;

    u.isRaging = false;
    u.tempHp = 0;
	u.damageBonus -= 2;

    Bus.emit('LOG', `😤 ${u.name} ends their Rage.`);
    update();
}

function handleHide() {
    const u = units[turn];
    if (!u.hasAction) return;
    u.isHiding = true; u.hasAction = false;
    Bus.emit('LOG', `${u.name} vanishes...`);
    update();
}

function startSneakTargeting() {
    const u = units[turn];
    if (!u.hasAction || !u.isHiding) return;
    
    isSneakTargeting = true;
    sneakAttacker = u;
    Bus.emit('LOG', `${u.name} aims from the shadows... select an adjacent enemy`);
}

function handleSneakAttack(target) {
    const u = units[turn];
    if (!u.hasAction || !u.isHiding) return;
    if (!target || target.hp <= 0) return;

    let mod = Math.max(u.stats?.str || 0, u.stats?.dex || 0);
    mod += u.hitBonus;
    
    const roll = Math.floor(Math.random() * 20) + 1;
    
    // Attack roll with +2 Sneak Advantage
    if (roll + mod + 2 >= (target.ac || 10)) {
        let dmg = (Math.floor(Math.random() * 6) + 1) + (Math.floor(Math.random() * 6) + 1) + mod;
        dmg += u.damageBonus;
        
        applyDamage(target, dmg);
        Bus.emit('LOG', `🗡️ SNEAK ATTACK! ${u.name} hits ${target.name} for ${dmg} dmg!`);
        
        if (target.hp <= 0) { 
            target.x = -1; 
            target.y = -1; 
        }
    } else { 
        Bus.emit('LOG', `💨 Sneak attack missed!`); 
    }
    
    u.isHiding = false; 
    u.hasAction = false; 
    update();
}

function handleHeal() {
    const u = units[turn];

    // Only healers can use this
    if (!HEALER_ROLES.includes(u.role)) {
        Bus.emit('LOG', `${u.name} cannot cast healing magic.`);
        return;
    }

    if (!u.hasAction) return;

    // Choose a target: any living PC (including self)
    const allies = units.filter(t => t.type === 'pc' && t.hp > 0);

    // If you want a UI selection later, replace this with a target picker
    const target = allies.length > 1 ? allies[0] : u;

    // Heal amount: 2–7 HP
    const heal = Math.floor(Math.random() * 6) + 3;

    const oldHP = target.hp;
    target.hp = Math.min(target.maxHp, target.hp + heal);

    u.hasAction = false;

    Bus.emit('LOG', `💚 ${u.name} heals ${target.name} for ${target.hp - oldHP} HP.`);

    update();
}

function startHealTargeting() {
    const u = units[turn];

    if (!canHeal(u.role) || !u.hasAction) return;

    isHealing = true;
    healerUnit = u;

    Bus.emit('LOG', `${u.name} is selecting a healing target...`);
}

function applyHeal(healer, target) {
    const heal = Math.floor(Math.random() * 6) + 2; // 2–7 HP
    const before = target.hp;

    target.hp = Math.min(target.maxHp, target.hp + heal);
    healer.hasAction = false;

    Bus.emit('LOG', `💚 ${healer.name} heals ${target.name} for ${target.hp - before} HP.`);

    update();
}

function isAnyBardSinging() {
    return units.some(u => u.type === 'pc' && u.role === 'Bard' && u.isSinging);
}

function handleSing() {
    const bard = units[turn];
    if (bard.role !== "Bard" || !bard.canSing) return;

    bard.canSing = false;
    bard.isSinging = true;

    // Buff allies
    units.forEach(u => {
        if (u.type === "pc" && u !== bard) {
            u.hitBonus += 1;
            u.damageBonus += 1;
        }
    });

    // Penalize Bard
    bard.hitBonus -= 1;
    bard.damageBonus -= 1;

    Bus.emit('LOG', `🎶 ${bard.name} sings! Allies gain +1 hit/dmg, Bard suffers -1 hit/dmg and cannot cast spells.`);

    endReactionPhase();
}

function startMeleeTargeting() {
    const u = units[turn];
    if (!u.hasAction) return;
	console.log("DEBUG: melee targeting started");
	console.log("DEBUG: isMeleeTargeting =", isMeleeTargeting);
	console.log("DEBUG: meleeAttacker =", meleeAttacker?.name);

    isMeleeTargeting = true;
    meleeAttacker = u;

    Bus.emit('LOG', `${u.name} prepares to strike... select an adjacent enemy`);
}

function getAdjacentEnemy(attacker) {
    return units.find(t =>
        t.type !== attacker.type &&
        t.hp > 0 &&
        // ⭐ CHANGE: Use Math.max so monsters recognize diagonal targets as adjacent
        Math.max(Math.abs(t.x - attacker.x), Math.abs(t.y - attacker.y)) === 1
    );
}

function handleRangedAttack(attacker, target) {
    const roll = Math.floor(Math.random() * 20) + 1;
    const totalHit = roll + (attacker.hitBonus || 0);

    Bus.emit('LOG', `${attacker.name} fires a crossbow bolt! (Roll: ${roll} + ${attacker.hitBonus || 0})`);

    if (totalHit >= target.ac) {
        const dmgRoll = Math.floor(Math.random() * 8) + 1; // 1d8
        const totalDmg = dmgRoll + (attacker.damageBonus || 0);

        Bus.emit('LOG', `🏹 Hit! The bolt deals ${totalDmg} damage.`);
        applyDamage(target, totalDmg);
    } else {
        Bus.emit('LOG', `❌ Miss! The bolt flies wide.`);
    }

    attacker.hasAction = false;
    update();
    endTurn();
}

function startReactionPhase() {
    isReactionPhase = true;
    console.log("REACTION PHASE PCs:", units.filter(u => u.type === "pc"));

    // ⭐ Grab the controls container to append the reaction view inside it
    const controlsWindow = document.getElementById('controls');
    let panel = document.getElementById('reaction-panel');
    
    if (panel) {
        panel.innerHTML = "";
        // Move it into controls if it was anywhere else
        if (controlsWindow && panel.parentNode !== controlsWindow) {
            controlsWindow.appendChild(panel);
        }
    } else {
        panel = document.createElement('div');
        panel.id = 'reaction-panel';
        panel.className = 'reaction-panel';
        if (controlsWindow) {
            controlsWindow.appendChild(panel);
        } else {
            document.body.appendChild(panel);
        }
    }

    // Set layout display to flex so centering styles work nicely
    panel.style.display = "flex";

    // --- (Keep your entire existing loop unchanged) ---
    units.filter(u => u.type === 'pc' && u.hp > 0).forEach((pc, index) => {
        const div = document.createElement('div');
        div.className = "reaction-entry";
        div.innerText = pc.name + ": "; // Cleaner separator label

        // Add reaction button based on role
        if (pc.race === "Barbarian" && !pc.usedRage) {
            createReactionBtn(div, "Rage", () => {
                handleRage(pc);
            });
        }

        if (pc.role === "Miner" && pc.canHide) {
            createReactionBtn(div, "Hide", () => {
                pc.isHiding = true;
                pc.canHide = false;
                Bus.emit('LOG', `${pc.name} hides in the shadows.`);
            });
        }

        if (pc.role === "Bard" && pc.canSing && !isAnyBardSinging()) {
            createReactionBtn(div, "Sing", () => {
                pc.canSing = false;
                pc.isSinging = true;

                units.forEach(u => {
                    if (u.type === "pc" && u !== pc) {
                        u.hitBonus = (u.hitBonus || 0) + 1;
                        u.damageBonus = (u.damageBonus || 0) + 1;
                    }
                });

                pc.hitBonus = (pc.hitBonus || 0) - 1;
                pc.damageBonus = (pc.damageBonus || 0) - 1;

                Bus.emit('LOG', `${pc.name} sings an inspiring tune! Allies gain +1 hit/dmg, Bard suffers -1 hit/dmg and cannot cast spells.`);
            });
        }

        panel.appendChild(div);
    });

    // Add "Continue" button
    const cont = document.createElement('button');
    cont.innerText = "Continue";
    cont.onclick = () => {
        isReactionPhase = false;
        panel.style.display = "none";
        roundStarted = true;   
        update();
    };
    panel.appendChild(cont);
}

function createReactionBtn(parent, text, func) {
    const btn = document.createElement('button');
    btn.innerText = text;
    btn.onclick = func;
    parent.appendChild(btn);
}

function endTurn() {
    isMoving = false;
    const current = units[turn];

    if (current && current.isRaging) {
        current.rageTurnsActive++;
    }

    // Resolve queued end-of-round spells
    const lastAliveIndex = units.findLastIndex(u => u.hp > 0);
    if (turn === lastAliveIndex && pendingSpells.length > 0) {
        pendingSpells.forEach(({ caster, target, spell }) => {
            if (!caster.isConcentrating) {
                Bus.emit('LOG', `💨 ${caster.name}'s ${spell} fizzles.`);
                return;
            }
			if (target.hp > 0) {
				const d = Math.floor(Math.random() * 8) + 2;
				Bus.emit('LOG', `🔥 ${caster.name}'s ${spell} targets ${target.name}:`);

				// Pass the damage directly to the engine to handle mitigation, health tracking, and rewards
				applyDamage(target, d);
			}
        });
        pendingSpells = [];
    }

    // Cycle to next living combatant
    let attempts = 0;
    do {
        turn = (turn + 1) % units.length;
        attempts++;
    } while (units[turn].hp <= 0 && attempts < units.length);

    const active = units[turn];

    // Round Reset / Reaction Phase Trigger Loop
    const firstPCIndex = units.findIndex(u => u.type === 'pc');
    if (turn === firstPCIndex) {
        roundStarted = false;

        if (isAnyBardSinging()) {
            const singingBard = units.find(u => u.type === "pc" && u.role === "Bard" && u.isSinging);
            if (singingBard) {
                singingBard.isSinging = false;
                units.forEach(u => {
                    if (u.type === "pc" && u !== singingBard) {
                        u.hitBonus -= 1; u.damageBonus -= 1;
                    }
                });
                singingBard.hitBonus += 1; singingBard.damageBonus += 1;
                Bus.emit('LOG', `🎵 ${singingBard.name}'s song fades.`);
            }
        }

        units.forEach(pc => {
            if (pc.type !== 'pc') return;
            if (pc.role === "Miner") pc.canHide = true;
            if (pc.role === "Bard") pc.canSing = true;
        });
    }

    active.hasAction = true;
    active.speed = 6;

    if (!roundStarted) {
        roundStarted = true;
        startReactionPhase();
        return; 
    }

    Bus.emit('LOG', `Turn: ${active.name}`);
    update(); // Now completely safe to call for both types!

    if (active.type === 'monster') {
        setTimeout(monsterAI, 800);
    }
}

function monsterAI() {
    const u = units[turn];
    if (!u || u.hp <= 0) return endTurn();

    let target = units.find(t => t.type === 'pc' && t.hp > 0);
    if (!target) return endTurn();

    let dist = Math.max(Math.abs(u.x - target.x), Math.abs(u.y - target.y));
    
    // 1. If not adjacent, try to move closer first
    if (dist > 1) {
        for (let i = 0; i < u.speed; i++) {
            const dx = (u.x < target.x ? 1 : u.x > target.x ? -1 : 0);
            const dy = (u.y < target.y ? 1 : u.y > target.y ? -1 : 0);

            const occupied = getOccupiedSquares();

            if (!occupied[u.x + dx]?.[u.y + dy]) {
                processMove(u.x + dx, u.y + dy, true);
            }
            else if (!occupied[u.x + dx]?.[u.y]) {
                processMove(u.x + dx, u.y, true);
            }
            else if (!occupied[u.x]?.[u.y + dy]) {
                processMove(u.x, u.y + dy, true);
            }
            else {
                Bus.emit('LOG', `${u.name} is blocked.`);
                break;
            }

            // Check distance again after every step taken
            const newDist = Math.max(Math.abs(u.x - target.x), Math.abs(u.y - target.y));
            if (newDist <= 1) break;
        }
    }

    // 2. Refresh distance state after movement options run out
    dist = Math.max(Math.abs(u.x - target.x), Math.abs(u.y - target.y));

    // 3. If adjacent now, unleash the attack!
    if (dist <= 1) {
        const adjacentEnemy = getAdjacentEnemy(u);
        if (adjacentEnemy) {
            handleAttack(u, adjacentEnemy);
        } else {
            Bus.emit('LOG', `${u.name} growls but finds no target.`);
            u.hasAction = false;
        }
    } else {
        Bus.emit('LOG', `${u.name} cannot reach anyone.`);
    }

    // 4. Cleanly pass control to the next character in sequence
    setTimeout(endTurn, 600);
}

function awardFoeDefeat(target) {
    // Safety check: only process monsters that haven't been resolved yet
    if (!target || target.type !== "monster" || target.hp === -999) return;

    Bus.emit('LOG', `💀 ${target.name} has been overcome!`);

    // Mark unit internally as permanently resolved and clear coordinates
    target.hp = 0; 
    target.x = -1;
    target.y = -1;
    
    // Use a special internal flag so they aren't accidentally rewarded twice
    target.isDefeated = true; 

    // UNIVERSAL RESOURCE POOLING
    const template = window.MONSTER_DB ? window.MONSTER_DB[target.id] : null;
    
    // 1. Pool XP
    const xpValue = template?.xp || 0;
    battleXP += xpValue;
    if (xpValue > 0) {
        Bus.emit('LOG', `✨ Gained ${xpValue} XP from ${target.name}`);
    }

    // 2. Pool Loot Items
    if (template?.loot && Array.isArray(template.loot)) {
        const savedData = JSON.parse(localStorage.getItem('currentBattle')) || {};
        if (!savedData.loot) savedData.loot = [];

        template.loot.forEach(itemDrop => {
            const existing = savedData.loot.find(l => l.item === itemDrop.item);
            if (existing) {
                existing.qty += itemDrop.qty;
            } else {
                savedData.loot.push({ item: itemDrop.item, qty: itemDrop.qty });
            }
        });
        
        localStorage.setItem('currentBattle', JSON.stringify(savedData));
    }

    // 3. Future tracks (Gold, Faction Reputation, Story Keys) hook directly here:
    // if (template?.gold) { battleGold += template.gold; }

    update();
}

function checkVictory() {
    if (victoryShown) return; 
    
    // ⭐ FIX: Prevent premature activation before round officially starts
    if (units.length === 0 || !roundStarted) return;

    const aliveMonsters = units.filter(u => u.type === 'monster' && u.hp > 0);

    if (aliveMonsters.length === 0) {
        victoryShown = true; // Set early to prevent parallel executions

        const savedData = JSON.parse(localStorage.getItem('currentBattle')) || {};
        const xp = battleXP;
        const loot = savedData.loot || [];

        const defeated = units
            .filter(u => u.type === 'monster')
            .map(u => u.name)
            .join("<br>");

        const lootHTML = loot.length
            ? loot.map(l => `${l.qty} × ${l.item}`).join("<br>")
            : "(none)";

        const summaryHTML = `
            <strong>Defeated Enemies:</strong><br>
            ${defeated}<br><br>
            <strong>XP Gained:</strong><br>
            ${xp}<br><br>
            <strong>Spoils:</strong><br>
            ${lootHTML}
        `;

        showVictoryWindow(summaryHTML, () => {
            Bus.emit('LOG', "VICTORY!");
            localStorage.removeItem('currentBattle');

            if (window.parent) {
                window.parent.postMessage({
                    type: "BATTLE_COMPLETE",
                    result: units.filter(u => u.type === 'pc'),
                    xp: battleXP,
                    loot: loot
                }, "*");
            }
        });
    }
}

function showVictoryWindow(summary, onClose) {
    const overlay = document.createElement('div');
    overlay.id = "victory-window";
    overlay.style = `
        position: fixed;
        top: 0; left: 0;
        width: 100vw; height: 100vh;
        background: rgba(0,0,0,0.8);
        color: white;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 99999;
        font-family: sans-serif;
        text-align: center;
    `;

    overlay.innerHTML = `
        <div style="background:#222; padding:20px; border-radius:10px; width:300px;">
            <h2 style="margin-top:0;">Victory!</h2>
            <div id="victory-summary" style="margin-bottom:20px; font-size:14px;">
                ${summary}
            </div>
            <button id="victory-close" style="
                padding:10px 20px;
                background:#27ae60;
                border:none;
                color:white;
                border-radius:5px;
                cursor:pointer;
                font-size:16px;
            ">Continue</button>
        </div>
    `;

    document.body.appendChild(overlay);

	document.getElementById("victory-close").onclick = () => {
		console.log("DEBUG: Victory close clicked");
		overlay.remove();
		console.log("DEBUG: Overlay removed");

		if (onClose) {
			console.log("DEBUG: Calling onClose()");
			onClose();
		} else {
			console.log("DEBUG: No onClose callback");
		}
	};

}

console.log("MONSTER_DB:", window.MONSTER_DB);


Bus.on('LOG', (msg) => {
    const l = document.getElementById('log');
    const entry = document.createElement('div');
    entry.innerText = `> ${msg}`;
    l.prepend(entry);
});

init();
window.addEventListener("beforeunload", () => {
    console.warn("IFRAME IS BEING RELOADED!");
});

</script>
