<!DOCTYPE html>
<html>
<head>
    <title>D&D Virtual Table Top</title>
    <meta name="viewport" content="width=540, user-scalable=no" charset="UTF-8">

<link rel="stylesheet" href="battle.css">
<link href="https://fonts.googleapis.com/css2?family=Squada+One&display=swap" rel="stylesheet">

</head>
<body>

<div id="confirm-modal" class="confirm-modal hidden">
  <div class="confirm-box">
    <div id="confirm-message"></div>
    <div class="confirm-buttons">
      <button id="confirm-yes">Yes</button>
      <button id="confirm-no">No</button>
    </div>
  </div>
</div>

<div id="m-viewport" style="display:none;">
	<div id="m-dialog-box"></div>
	<div id="m-choices-container"></div>
</div>
<div id="screen-wrapper">

<div id="screen">
	<div id="skill-box" style="display:none;">
		<div id="skill-box-inner">
			<h1 id="skill-box-title"></h1>

			<div id="skill-box-content"></div>


			<div class="skill-box-buttons">
				<button id="skill-box-confirm">Confirm</button>
				<button id="skill-box-cancel" class="cancel-btn">Cancel</button>
			</div>
		</div>
	</div>
    <div id="grid">
        <div class="grid-overlay"></div>
        <div id="active-ring" class="active-ring"></div>
    </div>
    <div id="log">> Battle Initialized.
		<div id="log-buttons">
			<button onclick="copyBattleLog()">Copy</button>
			<button onclick="downloadBattleLog()">TXT</button>
		</div>
	</div>
	<!-- <div id="reaction-panel" class="reaction-panel"></div> -->
    <div id="controls">
        <div class="btn-group" id="action-bar"></div>
		<div id="right-column">

			<div id="stats-panel">
				<strong id="unit-name">Name</strong>
				<span id="unit-hp">HP: 0</span>
				<span id="unit-speed">SPD: 0</span>
			</div>
			<div id="bottom-buttons">
				<button id="end-turn-btn" onclick="endTurn()">END TURN</button>
				<button id="retreat-btn" onclick="handleRetreat()">RETREAT</button>
			</div>
		</div>
	<div id="dm-screen"></div>
	<div id="reaction-title">REACTION PHASE</div>

    </div>
</div>
</div>

<script>

console.log("Battle iframe loaded:", window.location.href);
const Bus = {
    events: {},
    on(event, cb) { if(!this.events[event]) this.events[event] = []; this.events[event].push(cb); },
    emit(event, data) { if(this.events[event]) this.events[event].forEach(cb => cb(data)); }
};

let staticObstacles = [],
    units = [],
    round = 0,
    isMoving = false,
    battleXP = 0,
    isReactionPhase = false,
    roundStarted = false,
    isHealing = false,
    healerUnit = null,
    isCastingSpell = false,
    spellCaster = null,
    selectedSpell = null,
    pendingSpells = [],
    victoryShown = false,
    isRangedTargeting = false,
    rangedShooter = null,
    isMeleeTargeting = false,
    meleeAttacker = null,
    isSneakTargeting = false,
    sneakAttacker = null,
    initiativeOrder = [],
    turnIndex = 0,
	pendingReactionPanels = 0,
	currentAttackType = null;
	 isLayOnHandsTargeting = false;
	 layOnHandsUser = null;
	 layOnHandsAmount = 0;
	 layOnHandsCure = false; 

fetch('/battle_dialog.json')
  .then(r => r.json())
  .then(json => {

      // Share with parent
      parent.BattleScenes = json;

  });

const STRDEX_TABLE = {
  str: ['warrior', 'fighter', 'barbarian', 'paladin', 'cleric', 'ranger', 'monk', 'shaman', 'swordmage', 'brute', 'squire', 'paladin', 'bouncer', 'fallen paladin', 'clericbot', 'druid', 'warlock'],
  dex: ['thief', 'rogue', 'bard', 'deputy', 'miner', 'arcane trickster', 'green knight']
};

const firstPCIndex = units.findIndex(u => u.type === "pc");

function findUnitAt(cx, cy) {
    return units.find(u => {
			if (u.size === "H") {
			return (
				cx >= u.x && cx <= u.x + 2 &&
				cy >= u.y && cy <= u.y + 2
			);
		}

        if (u.size === "L") {
            return (
                (u.x === cx && u.y === cy) ||
                (u.x + 1 === cx && u.y === cy) ||
                (u.x === cx && u.y + 1 === cy) ||
                (u.x + 1 === cx && u.y + 1 === cy)
            );
        }
        return u.x === cx && u.y === cy;
    });
}

function getChebyshevDistance(attacker, target) {
	if (target.size === "H") {
		let best = Infinity;
		for (let dx = 0; dx < 3; dx++) {
			for (let dy = 0; dy < 3; dy++) {
				const tx = target.x + dx;
				const ty = target.y + dy;
				const dist = Math.max(Math.abs(tx - attacker.x), Math.abs(ty - attacker.y));
				if (dist < best) best = dist;
			}
		}
		return best;
	}

    // If target is Large, check distance to all 4 squares and take the closest
    if (target.size === "L") {
        const squares = [
            { x: target.x,     y: target.y },
            { x: target.x + 1, y: target.y },
            { x: target.x,     y: target.y + 1 },
            { x: target.x + 1, y: target.y + 1 }
        ];

        let best = Infinity;
        for (const s of squares) {
            const dx = Math.abs(s.x - attacker.x);
            const dy = Math.abs(s.y - attacker.y);
            const dist = Math.max(dx, dy);
            if (dist < best) best = dist;
        }
        return best;
    }

    // Normal 1×1 target
    const dx = Math.abs(target.x - attacker.x);
    const dy = Math.abs(target.y - attacker.y);
    return Math.max(dx, dy);
}

function showConfirmation(message) {
    return new Promise(resolve => {
        const modal = document.getElementById('confirm-modal');
        const msg = document.getElementById('confirm-message');
        const yesBtn = document.getElementById('confirm-yes');
        const noBtn = document.getElementById('confirm-no');

        msg.textContent = message;
        modal.classList.remove('hidden');

        const cleanup = () => {
            modal.classList.add('hidden');
            yesBtn.removeEventListener('click', yesHandler);
            noBtn.removeEventListener('click', noHandler);
        };

        const yesHandler = () => { cleanup(); resolve(true); };
        const noHandler = () => { cleanup(); resolve(false); };

        yesBtn.addEventListener('click', yesHandler);
        noBtn.addEventListener('click', noHandler);
    });
}


async function init() {
	console.log(`Running init() at round ${round}`);

    const savedData = localStorage.getItem('currentBattle');
    if (!savedData) return Bus.emit('LOG', "ERR: No battle data found!");

    const data = JSON.parse(savedData);

    // FIXED: use data.monsterDB, not savedData.monsterDB
    window.MONSTER_DB = data.monsterDB;

    const grid = document.getElementById('grid');

    try {
        // 1. Direct fetch bypassing any file hierarchy. 
        // Replace 'battle.json' with your actual relative path (e.g., 'data/battle.json')
        const response = await fetch('battle.json'); 
        if (!response.ok) throw new Error("Could not fetch battle.json");
        const battleConfig = await response.json();

        // 2. Identify the active key (Fallback to missionId since encounterKey was undefined)
        const activeKey = data.encounterKey || data.missionId;
        
        // 3. Resolve the map name through the encounters configuration
        const encounter = battleConfig.encounters ? battleConfig.encounters[activeKey] : null;
        const mapName = encounter ? encounter.map : activeKey;
        
        // 4. Retrieve the map object from the parsed JSON
        const currentMap = battleConfig.maps ? battleConfig.maps[mapName] : null;

        // 5. Apply the background URL dynamically
        const defaultUrl = "/assets/battlemaps/green_1.png";
        const bgUrl = currentMap ? currentMap.url : defaultUrl;
        grid.style.backgroundImage = `url('${bgUrl}')`;

        // 6. Pull the obstacles array straight from the JSON map object
        staticObstacles = currentMap ? currentMap.obstacles : [];

    } catch (error) {
        console.error("Initialization map loading failed:", error);
        // Secure fallback so the UI renders safely even on error
        grid.style.backgroundImage = `url('/assets/battlemaps/green_1.png')`;
        staticObstacles = [];
    }

	round++;
	units = [
		...data.party.map(p => ({
			...p,
			type: 'pc',
			traits: p.traits || [],   // ⭐ FIXED — now traits survive
			tempHp: p.tempHp || 0,
			speed: 6,
			maxSpeed: 6,
			hasAction: true,
			hasReacted: false,
			stunned: false,
			retreated: false,
			retreatHp: null,
			isConcentrating: false,
			isHiding: p.isHiding || false,
			isRaging: p.isRaging || false,
			usedRage: p.usedRage || false,
			canSing: p.canSing ?? true,
			canHide: p.canHide ?? true,
			maxHp: p.maxHp || p.hp,
			// ⭐ Preserve bard song state
			//hitBonus: p.hitBonus || 0,
			hitBonus: (p.hitBonus || 0) + (p.prof || 0),
			// new hitBonus adds prof 
			damageBonus: p.damageBonus || 0,
			isSinging: p.isSinging || false,
		})),
		
        ...data.monsters.map(m => ({
            ...m,
            type: 'monster',
            speed: 6,
            maxSpeed: 6,
            hasAction: true,
            maxHp: m.hp,
			stunned: false
        }))
    ];

	// Apply STR/DEX bonuses to all units (PCs only)
	for (let i = 0; i < units.length; i++) {
		if (units[i].type === 'pc') {
			units[i] = applyStrDexAttackBonus(units[i]);
		}
	}

	rollInitiativeForAll();   // ← FIRST ROUND INITIATIVE
	
	requestAnimationFrame(() => {startReactionPhase();	});
	
	// ⭐ Bard song fade: runs at the start of the Bard's next turn
	const active = units[initiativeOrder[turnIndex].index];
    grid.innerHTML = '<div class="grid-overlay"></div><div id="active-ring" class="active-ring"></div>';

    for (let i = 0; i < 100; i++) {
        let cell = document.createElement('div');
        cell.className = 'cell';
        let cx = i % 10, cy = Math.floor(i / 10);
		    // ⭐ Mark obstacles
		if (staticObstacles.some(o => o.x === cx && o.y === cy)) {
			cell.classList.add("obstacle");
		}
		cell.onclick = async () => {
			// ⭐ LAY ON HANDS TARGETING
			
			console.log("LayOnHands active:", isLayOnHandsTargeting);
			if (isLayOnHandsTargeting) {
				const target = findUnitAt(cx, cy);
				console.log("Clicked coords:", cx, cy);
				console.log("Caster coords:", layOnHandsUser.x, layOnHandsUser.y);
				console.log("findUnitAt result:", target);

				if (!target || target.type !== "pc") {
					Bus.emit('LOG', "Invalid Lay on Hands target.");
					isLayOnHandsTargeting = false;
					layOnHandsUser = null;
					return;
				}

				const distance = getChebyshevDistance(layOnHandsUser, target);
				if (distance !== 1 && distance !== 0) {
					Bus.emit('LOG', "Target is not in melee range.");
					isLayOnHandsTargeting = false;
					layOnHandsUser = null;
					return;
				}

				const pool = layOnHandsUser.skills.layonhands;
				const missing = target.maxHp - target.hp;

				const canCure = target.status?.poison || target.status?.disease;
				const cureChecked = canCure ? true : false;
				const cureDisabled = pool < 5;

				console.log("Opening skill box now...");
				showDMScreen();
				let statusText = "";

				if (target.status?.poison) statusText += "Poisoned ";
				if (target.status?.disease) statusText += "Diseased ";

				statusText = statusText.trim();
				if (statusText === "") statusText = "Healthy";

				const result = await skillBox(
					"Holy",
					null, null,
					true, true,
					{
						title: "Lay On Hands",
						pool: pool,
						targetName: target.name,
						targetHp: target.hp,
						targetMaxHp: target.maxHp,
						statusText: statusText,
						intLabel: "Heal Amount:",
						min: 1,
						max: Math.min(pool, missing),
						value: Math.min(pool, missing),
						checkboxLabel: "Cure poison/disease (cost 5)",
						checkboxChecked: cureChecked,
						checkboxDisabled: cureDisabled
					}
				);
				hideDMScreen();
				if (result.cancelled) {
					Bus.emit('LOG', "Lay On Hands cancelled.");
					isLayOnHandsTargeting = false;
					layOnHandsUser = null;
					return;
				}
				handleLayOnHands(layOnHandsUser, target, result.amount, result.checked);
				isLayOnHandsTargeting = false;
				layOnHandsUser = null;
				return;
			}
					
			// ⭐ HEALING TARGET SELECTION
			if (isHealing) {
				const target = findUnitAt(cx, cy);

				if (!target) {
					Bus.emit('LOG', "Invalid healing target.");
					isHealing = false;
					healerUnit = null;
					return;
				}

				applyHeal(healerUnit, target);

				isHealing = false;
				healerUnit = null;
				return;
			}
			// ⭐ SPELL TARGETING
			if (isCastingSpell) {
				const target = findUnitAt(cx, cy);

				if (!target) {
					Bus.emit('LOG', "Invalid spell target.");
					isCastingSpell = false;
					spellCaster = null;
					selectedSpell = null;
					return;
				}

				// Queue the spell for end-of-round resolution
				pendingSpells.push({ caster: spellCaster, target, spell: selectedSpell });
				// ⭐ Start concentration
				spellCaster.isConcentrating = true

				Bus.emit('LOG', `${spellCaster.name} is casting ${selectedSpell} aiming at ${target.name}!`);

				spellCaster.hasAction = false;

				// Exit spell mode
				isCastingSpell = false;
				spellCaster = null;
				selectedSpell = null;

				update();
				return;
			}

			// ⭐ RANGED TARGETING
			if (isRangedTargeting) {
				const target = findUnitAt(cx, cy);

				if (!target) {
					Bus.emit('LOG', "Invalid ranged target.");
					isRangedTargeting = false;
					rangedShooter = null;
					return;
				}

				handleRangedAttack(rangedShooter, target);

				isRangedTargeting = false;
				rangedShooter = null;
				return;
			}

			// ⭐ MELEE TARGETING
			// Inside your init() function cell click handler:
			if (isMeleeTargeting) {
				const target = findUnitAt(cx, cy);
				if (!target) {
					Bus.emit('LOG', "Invalid melee target.");
					isMeleeTargeting = false;
					meleeAttacker = null;
					return;
				}
								
				const distance = getChebyshevDistance(meleeAttacker, target);

				if (distance !== 1) {
					Bus.emit('LOG', "Target is not in melee range.");
					isMeleeTargeting = false;
					meleeAttacker = null;
					return;
				}

				
				handleAttack(meleeAttacker, target);
				console.log("init() ran handleAttack(meleeAttacker, target);");
				isMeleeTargeting = false;
				meleeAttacker = null;
				return;
			}

			// Add this inside cell.onclick alongside your other targeting modes:
			if (isSneakTargeting) {
				const target = findUnitAt(cx, cy);
				if (!target) {
					Bus.emit('LOG', "Invalid sneak attack target.");
					isSneakTargeting = false;
					sneakAttacker = null;
					return;
				}

				// Range check (using Math.max to respect your diagonal rule)
				const distance = getChebyshevDistance(sneakAttacker, target);

				if (distance !== 1) {
					Bus.emit('LOG', "Target is out of sneak attack range.");
					isSneakTargeting = false;
					sneakAttacker = null;
					return;
				}

				handleSneakAttack(target);
				isSneakTargeting = false;
				sneakAttacker = null;
				return;
			}

			// ⭐ NORMAL CLICK BEHAVIOR
			processMove(cx, cy);
		};

        grid.appendChild(cell);
    }

	units.forEach((u, i) => {
		let t = document.createElement('div');
		t.id = `t-${i}`;

		// Base class
		t.className = `token`;

		// Apply size class
		if (u.size === "L") {
			t.classList.add("token-large");
		}
		if (u.size === "H") t.classList.add("token-huge");
		
		if (u.noImageRing) {
			t.classList.add("no-image-ring");
		}
		// Color
		t.style.backgroundColor = u.type === 'pc' ? "#3498db" : "#c0392b";

		// Icon or fallback text
		if (u.icon) {
			t.style.backgroundImage = `url('${u.icon}')`;
		} else {
			t.innerText = u.name.substring(0,2).toUpperCase();
		}

		grid.appendChild(t);
	});


	// Mark that the round has already started
	roundStarted = true;
    update();

	
	// Start the very first turn properly
	// const first = units[initiativeOrder[turnIndex].index];
	// Bus.emit('LOG', `Turn: ${first.name}`);

	//if (first.type === 'monster') { 		setTimeout(monsterAI, 600); 	}
}

function update() {
    if (isReactionPhase) return; 
	console.log(`Running update() at round ${round}`);

    const active = units[initiativeOrder[turnIndex].index];
    if (!active) return;

    // 1. ALWAYS update position rings and token visibility for both PCs and Monsters
    const ring = document.getElementById('active-ring');
    ring.style.left = (active.x * 54 + 2) + 'px';
    ring.style.top = (active.y * 54 + 2) + 'px';

    units.forEach((u, i) => {
        const t = document.getElementById(`t-${i}`);
        if (t) {
		        if (u.retreated) {
				t.style.display = "none";
				return;   }
        
            t.style.display = u.hp <= 0 ? 'none' : 'flex';
            t.style.left = (u.x * 54 + 4) + 'px';
            t.style.top = (u.y * 54 + 4) + 'px';
            t.style.opacity = u.isHiding ? "0.5" : "1";
        }
    });


    const bar = document.getElementById('action-bar');
    const endBtn = document.getElementById('end-turn-btn');
    //console.log("Traits:", active.traits);		//debug
	//console.log("isAnyBardSinging:", isAnyBardSinging());

    if (active.type === "monster") {
		showDMScreen();
        bar.innerHTML = '';
        if (endBtn) endBtn.disabled = true;
        checkVictory();
        return; 
    }
	if (active.type === "pc" && active.status === "NPC") {
		setTimeout(npcAI, 600);
	}

    // 2. Human Player character UI rebuild follows normally...
    if (endBtn) endBtn.disabled = false;
    document.getElementById('unit-name').innerText = active.name;
    let hpText = `HP: ${active.hp}`;
    if (active.tempHp && active.tempHp > 0) {
        hpText += ` 🛡️${active.tempHp}`;
    }
    document.getElementById('unit-hp').innerText = hpText;
    document.getElementById('unit-speed').innerText = `SPD: ${active.speed}`;

    const hitBonus = active.hitBonus || 0;
    const dmgBonus = active.damageBonus || 0;
    let hitEl = document.getElementById('unit-hitBonus') || document.createElement('span');
    let dmgEl = document.getElementById('unit-damageBonus') || document.createElement('span');
    hitEl.id = 'unit-hitBonus'; dmgEl.id = 'unit-damageBonus';
    document.getElementById('stats-panel').appendChild(hitEl);
    document.getElementById('stats-panel').appendChild(dmgEl);
    hitEl.style.display = hitBonus !== 0 ? "block" : "none";
    dmgEl.style.display = dmgBonus !== 0 ? "block" : "none";
    if (hitBonus !== 0) hitEl.innerText = `HIT: ${hitBonus > 0 ? "+" : ""}${hitBonus}`;
    if (dmgBonus !== 0) dmgEl.innerText = `DMG: ${dmgBonus > 0 ? "+" : ""}${dmgBonus}`;

    bar.innerHTML = '';
    createBtn(bar, "📍 Move", toggleMove, isMoving ? 'btn-move-active' : '', "move-btn");
	const hasElvishBow = active.inventory.some(i => i.item === "Elvish Bow");
    if (hasElvishBow) {
		createBtn(bar, "🏹 Elvish Bow", startRangedTargeting);
	}
    if (active.race === "Barbarian" && active.isRaging && active.rageTurnsActive >= 3) {
        createBtn(bar, "End Rage", handleEndRage);
    }
    if (active.role === "Bard") {
        createBtn(bar, "🏹 Crossbow", startRangedTargeting);
    }
    if (active.skills && active.skills.smite > 0) {
        createBtn(bar, "🔆 Divine Smite", startSmiteTargeting, "", "", "Holy");
    }
    if (isRogue(active.role)) {
        if (active.isHiding) {
            createBtn(bar, "🗡️ Sneak", startSneakTargeting);
        } else {
            createBtn(bar, "⚔️ Strike", startMeleeTargeting);
            createBtn(bar, "️👤 Hide", handleHide);
        }
    } else {
        if (!hasElvishBow) createBtn(bar, "⚔️ Strike", startMeleeTargeting);
    }
    if (canCast(active.role) && !active.isSinging && !active.isRaging) {
        createBtn(bar, "✨ Spell", handleSpell);
    }
    if (canHeal(active.role) && !active.isRaging) {
        createBtn(bar, "💚 Heal", startHealTargeting);
    }
	if (active.skills && active.skills.layonhands > 0) {
		createBtn(bar, "🤲 Lay on Hands", startLayOnHandsTargeting, "", "", "Holy");
	}
	if (
		active.traits?.includes("Comedian") &&
		!isAnyBardSinging()
	) {
		createBtn(bar, "🎭 Joke", startJokeAction);
	}
	
	createBtn(bar, "💥 Developer Auto‑Win", autoWinBattle, "", "auto-win-btn", "Dev");

    checkVictory();
}

function skillBox(theme, x, y, integerNeeded, checkboxNeeded, defaults = {}) {
    return new Promise(resolve => {

        const box = document.getElementById("skill-box");
        const inner = document.getElementById("skill-box-inner");
        const content = document.getElementById("skill-box-content");
        const title = document.getElementById("skill-box-title");

        // Reset content
        content.innerHTML = "";
		content.innerHTML = `
			<div class="skill-target-info">
				<strong>Available:</strong> ${defaults.pool}
				<strong>Target:</strong> ${defaults.targetName}  
				<br>
				<strong>HP:</strong> ${defaults.targetHp}/${defaults.targetMaxHp}
				<strong>Status:</strong> ${defaults.statusText}
			</div>
		`;

        // Apply theme
        inner.className = "";
        if (theme === "Holy") inner.classList.add("skill-theme-holy");
        if (theme === "Nature") inner.classList.add("skill-theme-nature");
        if (theme === "Chaos") inner.classList.add("skill-theme-chaos");
		// size
		inner.style.width = x + "px";
		inner.style.height = y + "px";

        // Title
        title.innerText = defaults.title || "Skill Input";

        // Integer input
        let intInput = null;
        if (integerNeeded) {
            intInput = document.createElement("input");
            intInput.type = "number";
            intInput.min = defaults.min || 1;
            intInput.max = defaults.max || 999;
            intInput.value = defaults.value || defaults.max || 1;
            intInput.style.width = "80px";
            intInput.style.marginBottom = "10px";

            const label = document.createElement("label");
            label.innerText = defaults.intLabel || "Amount:";
            label.appendChild(document.createElement("br"));
            label.appendChild(intInput);

            content.appendChild(label);
        }

        // Checkbox
        let checkbox = null;
        if (checkboxNeeded) {
            checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.checked = defaults.checkboxChecked || false;

function runSupportMageScript(u) {

    const monsters = units.filter(m => m.type === "monster" && m.hp > 0);
    if (monsters.length === 0) return endTurn();

    const corners = [
        { x: 0, y: 0 },
        { x: 0, y: GRID_H - 1 },
        { x: GRID_W - 1, y: 0 },
        { x: GRID_W - 1, y: GRID_H - 1 }
    ];

    let bestCorner = null;
    let bestDist = -Infinity;

    for (const corner of corners) {
        let minDist = Infinity;

        for (const m of monsters) {
            const dx = Math.abs(corner.x - m.x);
            const dy = Math.abs(corner.y - m.y);
            const dist = Math.max(dx, dy);
            if (dist < minDist) minDist = dist;
        }

        if (minDist > bestDist) {
            bestDist = minDist;
            bestCorner = corner;
        }
    }

    moveMonsterToward(u, bestCorner);

    npcCastSpell(u);

    endTurn();
}

function applyStrDexAttackBonus(unit) {
  if (!unit?.role || unit.type !== 'pc') return unit;

  // Normalize role (case-insensitive)
  const role = (unit.role || '').toLowerCase().trim();

  let modifier = 0;
  
  modifier += unit.prof; // this is the weapon proficient level taken from regular prof level, it needs to be later tested if the equipped weapon matches the "proficiency_weapon": "Martial", in the char sheet.
  
  if (STRDEX_TABLE.str.includes(role)) {
    modifier = unit.stats?.str || 0;           // ← from stats.str
  } 
  else if (STRDEX_TABLE.dex.includes(role)) {
    modifier = unit.stats?.dex || 0;           // ← from stats.dex
  }

  if (modifier === 0) return unit;

  return {
    ...unit,
    hitBonus: (unit.hitBonus || 0) + modifier,
    damageBonus: (unit.damageBonus || 0) + modifier,
  };
}

function applyDamage(target, amount) {
    let dmg = amount;

    // ⭐ 1. Temp HP absorbs damage first
    if (target.tempHp && target.tempHp > 0) {
        const absorbed = Math.min(target.tempHp, dmg);
        target.tempHp -= absorbed;
        dmg -= absorbed;

        Bus.emit('LOG', `🛡️ ${target.name}'s temp HP absorbs ${absorbed} damage.`);

        // If all damage was absorbed, stop here
        if (dmg <= 0) {
            update();
            return;
        }
    }

    // ⭐ 2. Remaining damage hits real HP
    target.hp -= dmg;
    Bus.emit('LOG', `💥 ${target.name} takes ${dmg} damage.`);

    // ⭐ 3. If HP drops to 0 or below, remove from board
    if (target.hp <= 0) {
        target.hp = 0;
        target.x = -1;
        target.y = -1;
		awardFoeDefeat(target);
		//Bus.emit('LOG', `☠️ ${target.name} falls!`);

		parent.postMessage({ type: "UNIT_DEFEATED", name: target.name }, "*");
		//Bus.emit('LOG', `💀 ${target.name} defeated.`);



		// ⭐ 4. Concentration breaks on ANY real HP damage
		if (target.isConcentrating) {
			target.isConcentrating = false;
			Bus.emit('LOG', `💥 ${target.name} loses concentration!`);
		}

    update();
	}
}

function processMove(tx, ty, force = false) {

    if (occupied[tx][ty]) return Bus.emit('LOG', "Space occupied!");

    let dist = Math.max(Math.abs(u.x - tx), Math.abs(u.y - ty));
    if (dist <= u.speed) {

function mark(map, x, y) {
    if (x >= 0 && x < 10 && y >= 0 && y < 10) {
        map[x][y] = true;
    }
}

function getOccupiedSquares() {
    const map = Array(10).fill().map(() => Array(10).fill(false));

    units.filter(u => u.hp > 0).forEach(u => {

        if (u.size === "H") {
            // 3×3
            for (let dx = 0; dx < 3; dx++) {
                for (let dy = 0; dy < 3; dy++) {
                    mark(map, u.x + dx, u.y + dy);
                }
            }

        } else if (u.size === "L") {
            // 2×2
            mark(map, u.x,     u.y);
            mark(map, u.x + 1, u.y);
            mark(map, u.x,     u.y + 1);
            mark(map, u.x + 1, u.y + 1);

        } else {
            // 1×1
            mark(map, u.x, u.y);
        }
    });

    staticObstacles.forEach(obs => mark(map, obs.x, obs.y));

    return map;
}

function handleAttack(attacker, target, action = null) {
    if (!attacker.hasAction) return;
    if (!target || target.hp <= 0) return;

    // --- HIT MOD ---
    let hitMod = attacker.type === "pc"
        ? attacker.hitBonus || 0
        : action?.hitMod ?? getMonsterStats(attacker)?.hitMod ?? 0;

    // --- RACIAL BONUS ---
    let racialBonus = 0;
    if (attacker.RacialEnemy && target.name.includes(attacker.RacialEnemy)) {
        racialBonus = 2;
        Bus.emit('LOG', `🎯 Racial Advantage!`);
    }

    // --- ROLL TO HIT ---
    const roll = Math.floor(Math.random() * 20) + 1;
    const totalToHit = roll + hitMod + racialBonus;

    const targetAC = target.ac || 10;
    const isCrit = roll === 20;
    const isHit = isCrit || (roll !== 1 && totalToHit >= targetAC);

    // --- ATTACK NAME ---
    const attackName =
        currentAttackType === "smite" ? "Divine Smite" :
        action ? action.name : "Attack";

    Bus.emit('LOG', `${attacker.name} uses ${attackName} on ${target.name}! (Roll: ${roll} + ${hitMod})`);

    // --- DAMAGE ---
    if (isHit) {
        let dmg = attacker.type === "pc"
            ? (Math.floor(Math.random() * 6) + 1) + (attacker.damageBonus || 0)
            : (Math.floor(Math.random() * (action?.damageDie ?? getMonsterStats(attacker)?.damageDie ?? 3)) + 1)
                + (action?.damageBonus ?? getMonsterStats(attacker)?.damageBonus ?? 0);

        // 🔆 SMITE OVERRIDE
        if (currentAttackType === "smite") {
            dmg = handleSmiteAttack(attacker, target, dmg);
        }

        Bus.emit('LOG', `⚔️ ${attacker.name} hits ${target.name} for ${dmg}!`);
        applyDamage(target, dmg);

    } else {
        Bus.emit('LOG', `🛡️ ${attacker.name} misses (${totalToHit} vs AC ${targetAC}).`);
    }

    // --- CLEAR SPECIAL ATTACK STATE ---
    currentAttackType = null;
    isMeleeTargeting = false;
    meleeAttacker = null;

    // --- UPDATE AFTER EVERYTHING ---
    if (attacker.type === "pc") {
        attacker.hasAction = false;
        update();   // ← NOW SAFE
    }
}

function getMonsterActionList(monster) {
    const stats = getMonsterStats(monster);
    if (!stats.actions) return [];

    let list = [];

    for (const act of stats.actions) {
        if (act["#"] === null) {
            // random single action
            list.push(act);
        } else {
            // fixed number of actions
            for (let i = 0; i < act["#"]; i++) {
                list.push(act);
            }
        }
    }

    // If monster has "attack": N, limit or expand list
    const count = stats.attack || 1;

    if (list.length > count) {
        // randomly pick N actions
        list = list.sort(() => Math.random() - 0.5).slice(0, count);
    } else if (list.length < count) {
        // randomly add more actions until reaching N
        while (list.length < count) {
            const random = stats.actions[Math.floor(Math.random() * stats.actions.length)];
            list.push(random);
        }
    }

    return list;
}

            {x: u.x + 1, y: u.y + 1}
        ];
    }
    return [{x: u.x, y: u.y}];
}

function startMeleeTargeting() {
    const u = units[initiativeOrder[turnIndex].index];
    if (!u.hasAction) return;
    isMeleeTargeting = true;
    meleeAttacker = u;

    Bus.emit('LOG', `${u.name} prepares to strike... select an adjacent enemy`);
}

function getAdjacentEnemy(attacker) {
    return units.find(t =>
        t.type !== attacker.type &&
        t.hp > 0 &&
        // ⭐ CHANGE: Use Math.max so monsters recognize diagonal targets as adjacent
        Math.max(Math.abs(t.x - attacker.x), Math.abs(t.y - attacker.y)) === 1
    );
}

function handleRangedAttack(attacker, target) {
    const roll = Math.floor(Math.random() * 20) + 1;
    const totalHit = roll + (attacker.hitBonus || 0);

    Bus.emit('LOG', `${attacker.name} fires a crossbow bolt! (Roll: ${roll} + ${attacker.hitBonus || 0})`);

    if (totalHit >= target.ac) {
        const dmgRoll = Math.floor(Math.random() * 8) + 1; // 1d8
        const totalDmg = dmgRoll + (attacker.damageBonus || 0);

        Bus.emit('LOG', `🏹 Hit! The bolt deals ${totalDmg} damage.`);
        applyDamage(target, totalDmg);
    } else {
        Bus.emit('LOG', `❌ Miss! The bolt flies wide.`);
    }

    attacker.hasAction = false;
    update();
    endTurn();
}

function startReactionPhase() {
    isReactionPhase = true;

    units.forEach(u => {
        if (u.type === "pc") u.hasReacted = false;
    });

    showReactionTitle();
    hideDMScreen();

    const { groupA, groupB } = getPCGroups();

    // Count how many panels will exist
    pendingReactionPanels = 1 + (groupB.length > 0 ? 1 : 0);

	requestAnimationFrame(() => {
		requestAnimationFrame(() => {

			// Draw B first (only if it exists)
			if (groupB.length > 0) {
				buildReactionPanel("reaction-panel-B", groupB);
			}

			// Draw A second (always)
			buildReactionPanel("reaction-panel-A", groupA);

		});
	});

}

function buildReactionPanel(panelId, pcList) {
    const controlsWindow = document.getElementById('controls');
    let panel = document.getElementById(panelId);

    if (!panel) {
        panel = document.createElement('div');
        panel.id = panelId;
        panel.className = 'reaction-panel';
        (controlsWindow || document.body).appendChild(panel);
    } else {
        panel.innerHTML = "";
    }

    panel.style.display = "flex";

    // Build PC entries
    pcList.forEach(pc => {
        const div = document.createElement('div');
        div.className = "reaction-entry";

        const header = document.createElement('div');
        header.className = "reaction-header";
        header.innerHTML = `<span class="r-name">${pc.name}</span><span class="r-meta">${pc.role} • hp ${pc.hp}/${pc.maxHp}`;
        div.appendChild(header);

        const actions = document.createElement('div');
        actions.className = "reaction-actions";
        div.appendChild(actions);

        if (pc.race === "Barbarian" && !pc.usedRage) {
            createReactionBtn(actions, "Rage", () => handleRage(pc), pc);
        }

        if (isRogue(pc.role) && pc.canHide) {
            createReactionBtn(actions, "Hide", () => {
                pc.isHiding = true;
                pc.canHide = false;
                Bus.emit('LOG', `${pc.name} hides in the shadows.`);
            }, pc);
        }

        if (pc.role === "Bard" && pc.canSing && !isAnyBardSinging()) {
			createReactionBtn(actions, "Sing", () => {
			handleSing(pc);
			}, pc);
        }

        createReactionBtn(actions, "Healing Potion", () => handleDrinkPotion(pc), pc);

        panel.appendChild(div);
    });

    // GO button
    const cont = document.createElement('button');
    cont.innerText = "GO";
    cont.classList.add("go-btn");

    cont.onclick = () => {
        panel.style.display = "none";

        pendingReactionPanels--;

        // Only end reaction phase when ALL panels are done
        if (pendingReactionPanels === 0) {
            isReactionPhase = false;
            hideReactionTitle();

            const active = units[initiativeOrder[turnIndex].index];
            Bus.emit('LOG', `Turn: ${active.name}`);

            update();

            if (active.type === "monster") {
                setTimeout(monsterAI, 600);
            }
        }
    };

    panel.appendChild(cont);
}

function createReactionBtn(parent, text, func, pc) {
    const btn = document.createElement('button');
    btn.innerText = text;

    btn.onclick = () => {
        if (pc.hasReacted) return; // ❌ Already reacted — ignore

        pc.hasReacted = true;      // ✅ Lock reactions
        func();                    // Run the actual reaction

        // Disable all buttons for this PC
        const container = parent.parentNode;
        container.querySelectorAll("button").forEach(b => {
            b.disabled = true;
            b.classList.add("reaction-used");
        });
    };

    parent.appendChild(btn);
}

function showReactionTitle() {
    document.getElementById("reaction-title").style.display = "block";
}

function hideReactionTitle() {
    document.getElementById("reaction-title").style.display = "none";
}

function getPCGroups() {
    const pcs = units.filter(u => u.type === "pc" && u.hp > 0);
    return {
        groupA: pcs.slice(0, 6),   // first 6 PCs
        groupB: pcs.slice(6, 12)   // PCs 7–12 (only if exist)
    };
}


function handleDrinkPotion(user) {
    if (!user || user.hp <= 0) return;

    // Heal amount: 2–7 HP
    const heal = Math.floor(Math.random() * 6) + 3;

    const oldHP = user.hp;
    user.hp = Math.min(user.maxHp, user.hp + heal);

    Bus.emit('LOG', `🧪 ${user.name} drinks a potion and heals ${user.hp - oldHP} HP.`);

    update();
    //buildReactionPanel();   // ⭐ refreshes HP in headers
}

function endTurn() {
    isMoving = false;

    // Rage tracking
    const current = units[initiativeOrder[turnIndex].index];
    if (current && current.isRaging) {
        current.rageTurnsActive++;
    }

    // Resolve end-of-round spells
    const lastAliveOrderIndex = [...initiativeOrder]
        .map((o, idx) => ({ idx, alive: units[o.index].hp > 0 }))
        .filter(o => o.alive)
        .map(o => o.idx)
        .pop();

    if (turnIndex === lastAliveOrderIndex && pendingSpells.length > 0) {
        pendingSpells.forEach(({ caster, target, spell }) => {
            if (!caster.isConcentrating) {
                Bus.emit('LOG', `💨 ${caster.name}'s ${spell} fizzles.`);
                return;
            }
            if (target.hp > 0) {
                const d = Math.floor(Math.random() * 8) + 2;
                Bus.emit('LOG', `🔥 ${caster.name}'s ${spell} hits ${target.name}:`);
                applyDamage(target, d);
            }
        });
        pendingSpells = [];
    }

    // ADVANCE TURN — NO RECURSION
    let attempts = 0;

    while (attempts < initiativeOrder.length) {
        turnIndex = (turnIndex + 1) % initiativeOrder.length;
        attempts++;

        const next = units[initiativeOrder[turnIndex].index];

        if (next.hp <= 0) continue;

        if (next.stunned) {
            Bus.emit('LOG', `${next.name} is stunned and loses their turn! 🤣`);
            next.stunned = false;
			next.hadAction = false;
            continue; // TURN COUNTS
        }

        break; // Found next active unit
    }

    const active = units[initiativeOrder[turnIndex].index];

    // ROUND BOUNDARY CHECK
    const firstAliveOrderIndex = initiativeOrder.findIndex(o => units[o.index].hp > 0);

    if (turnIndex === firstAliveOrderIndex && roundStarted) {
        roundStarted = false;

        refreshRound();

        // Bard song fade
        if (isAnyBardSinging()) {
            const singingBard = units.find(u => u.type === "pc" && u.role === "Bard" && u.isSinging);
            if (singingBard) {
                singingBard.isSinging = false;
                units.forEach(u => {
                    if (u.type === "pc" && u !== singingBard) {
                        u.hitBonus -= 1;
                        u.damageBonus -= 1;
                    }
                });
                singingBard.hitBonus += 1;
                singingBard.damageBonus += 1;
                Bus.emit('LOG', `🎵 ${singingBard.name}'s song fades.`);
            }
        }

        // Reset PC abilities
        units.forEach(pc => {
            if (pc.type !== 'pc') return;
            if (pc.role === "Miner") pc.canHide = true;
            if (pc.role === "Bard") pc.canSing = true;
        });
    }

    // START REACTION PHASE
    if (!roundStarted) {
        roundStarted = true;
        requestAnimationFrame(() => startReactionPhase());
        return;
    }

    // NORMAL TURN
    Bus.emit('LOG', `Turn: ${active.name}`);
    update();

    if (active.type === 'monster') {
        setTimeout(monsterAI, 800);
    }
}

function monsterAI() {
    const u = units[initiativeOrder[turnIndex].index];
    if (!u || u.hp <= 0) return endTurn();

    // ⭐ If stunned, skip their turn
    if (u.stunned) {
        Bus.emit('LOG', `${u.name} is stunned and loses their turn! 🤣`);
        //u.stunned = false;
        return endTurn();
    }

    // Monsters always start with an action
    u.hasAction = true;

    const target = findNearestPC(u);
    if (!target) return endTurn();
	
    // ⭐ NEW: Monster dialog (does NOT consume turn)
    if (u.dialog && !u._dialogPlayed) {
        u._dialogPlayed = true;   // mark as used
            // Call the parent's function from inside the iframe
		if (parent && typeof parent.renderScene === 'function') {
			parent.renderScene(u.dialog, "battle").catch(err => console.error(err));
		} else {
			console.warn("renderScene() not found in parent window");
		}
    }
    moveMonsterToward(u, target);

	if (u.hasAction) {
		const actions = getMonsterActionList(u);

		for (const act of actions) {

			const range = act.range || 1;

			// If not in range → move until in range or speed runs out
			while (!isInRange(u, target, range) && u.remainingSpeed > 0) {
				moveMonsterToward(u, target);
			}

			// If in range → attack
			if (isInRange(u, target, range)) {
				handleAttack(u, target, act);
			} else {
				Bus.emit('LOG', `${u.name} cannot reach ${target.name} for ${act.name}.`);
			}

			if (target.hp <= 0) break;
		}
	}



    update();
    setTimeout(() => {
        hideDMScreen();
        endTurn();
    }, 600);
}

function getSquares(u) {
    if (u.size === "L") {
        return [
            {x: u.x,     y: u.y},
            {x: u.x + 1, y: u.y},
            {x: u.x,     y: u.y + 1},
            {x: u.x + 1, y: u.y + 1}
        ];
    }
    return [{x: u.x, y: u.y}];
}

function findNearestPC(monster) {
    let nearest = null;
    let bestDist = Infinity;

    // Generate all squares the monster occupies
    const mSquares = [];
    const size = monster.size === "H" ? 3 : monster.size === "L" ? 2 : 1;

    for (let dx = 0; dx < size; dx++) {
        for (let dy = 0; dy < size; dy++) {
            mSquares.push({ x: monster.x + dx, y: monster.y + dy });
        }
    }

    for (const pc of units) {
        if (pc.type !== "pc" || pc.hp <= 0) continue;

        // Generate all squares the PC occupies (usually 1×1)
        const pcSize = pc.size === "H" ? 3 : pc.size === "L" ? 2 : 1;
        const pSquares = [];

        for (let dx = 0; dx < pcSize; dx++) {
            for (let dy = 0; dy < pcSize; dy++) {
                pSquares.push({ x: pc.x + dx, y: pc.y + dy });
            }
        }

        // Compare all square pairs
        for (const m of mSquares) {
            for (const p of pSquares) {
                const dx = Math.abs(p.x - m.x);
                const dy = Math.abs(p.y - m.y);
                const dist = Math.max(dx, dy);

                if (dist < bestDist) {
                    bestDist = dist;
                    nearest = pc;
                }
            }
        }
    }

    return nearest;
}


function moveMonsterToward(u, target) {

    let dist = Math.max(Math.abs(u.x - target.x), Math.abs(u.y - target.y));

    if (dist > 1) {

        for (let step = 0; step < u.speed; step++) {

            const dx = Math.sign(target.x - u.x);
            const dy = Math.sign(target.y - u.y);

            const occupied = getOccupiedSquares();

            const absDx = Math.abs(target.x - u.x);
            const absDy = Math.abs(target.y - u.y);

            let moved = false;

            function tryMove(nx, ny) {
                if (!occupied[nx]?.[ny]) {
                    u.x = nx;
                    u.y = ny;
                    return true;
                }
                return false;
            }

            if (absDy > absDx) {
                moved ||= tryMove(u.x, u.y + dy);
                moved ||= tryMove(u.x + dx, u.y);
                moved ||= tryMove(u.x + dx, u.y + dy);
            }
            else if (absDx > absDy) {
                moved ||= tryMove(u.x + dx, u.y);
                moved ||= tryMove(u.x, u.y + dy);
                moved ||= tryMove(u.x + dx, u.y + dy);
            }
            else {
                moved ||= tryMove(u.x + dx, u.y + dy);
                moved ||= tryMove(u.x + dx, u.y);
                moved ||= tryMove(u.x, u.y + dy);
            }

            if (!moved) break;

            dist = Math.max(Math.abs(u.x - target.x), Math.abs(u.y - target.y));
            if (dist <= 1) break;
        }
    }
}

function isTileFree(x, y) {
    // Stay inside the 10×10 grid
    if (x < 0 || x > 9 || y < 0 || y > 9) {
        return false;
    }

    // Check static obstacles
    if (staticObstacles.some(o => o.x === x && o.y === y)) {
        return false;
    }

    // Check if any living unit occupies the tile
    for (const u of units) {
        if (u.hp > 0 && u.x === x && u.y === y) {
            return false;
        }
    }

    return true;
}

function isAdjacent(u, target) {
    const uSquares = getSquares(u);
    const tSquares = getSquares(target);

    for (const a of uSquares) {
        for (const b of tSquares) {
            const dx = Math.abs(a.x - b.x);
            const dy = Math.abs(a.y - b.y);
            if (Math.max(dx, dy) === 1) return true;
        }
    }

    return false;
}

function awardFoeDefeat(target) {
    // Safety check: only process monsters that haven't been resolved yet
    if (!target || target.type !== "monster" || target.hp === -999) return;

    Bus.emit('LOG', `💀 ${target.name} has been overcome!`);

    // Mark unit internally as permanently resolved and clear coordinates
    target.hp = 0; 
    target.x = -1;
    target.y = -1;
    
    // Use a special internal flag so they aren't accidentally rewarded twice
    target.isDefeated = true; 

    // UNIVERSAL RESOURCE POOLING
    const template = window.MONSTER_DB ? window.MONSTER_DB[target.id] : null;
    
    // 1. Pool XP
    const xpValue = template?.xp || 0;
    battleXP += xpValue;
    if (xpValue > 0) {
        Bus.emit('LOG', `✨ Gained ${xpValue} XP from ${target.name}`);
    }

    // 2. Pool Loot Items
    if (template?.loot && Array.isArray(template.loot)) {
        const savedData = JSON.parse(localStorage.getItem('currentBattle')) || {};
        if (!savedData.loot) savedData.loot = [];

        template.loot.forEach(itemDrop => {
            const existing = savedData.loot.find(l => l.item === itemDrop.item);
            if (existing) {
                existing.qty += itemDrop.qty;
            } else {
                savedData.loot.push({ item: itemDrop.item, qty: itemDrop.qty });
            }
        });
        
        localStorage.setItem('currentBattle', JSON.stringify(savedData));
    }

    // 3. Future tracks (Gold, Faction Reputation, Story Keys) hook directly here:
    // if (template?.gold) { battleGold += template.gold; }

    update();
}

async function handleRetreat() {
    const activeIndex = initiativeOrder[turnIndex].index;
    const active = units[activeIndex];
    if (!active) return;

    const confirmed = await showConfirmation(`${active.name} wants to retreat. Allow it?`);
    if (!confirmed) {
        Bus.emit('LOG', `${active.name} decides to stay in the fight!`);
        return;
    }

    active.retreatHp = active.hp;
    active.hp = 0;
    active.hasAction = false;

    Bus.emit('LOG', `${active.name} retreats from battle!`);

    initiativeOrder = initiativeOrder.filter(o => o.index !== activeIndex);

    if (turnIndex >= initiativeOrder.length) {
        turnIndex = 0;
    }

    endTurn();
}


function checkVictory() {
    if (victoryShown) return; 
    
    // ⭐ FIX: Prevent premature activation before round officially starts
    if (units.length === 0 || !roundStarted) return;

    const aliveMonsters = units.filter(u => u.type === 'monster' && u.hp > 0 && !u.retreated);
	const alivePCs = units.filter(u => u.type === 'pc' && u.hp > 0);
	if (units.length === 0) {
		victoryShown = true;

		refreshRetreatHp();
		
		showDefeatWindow("No combatants remain.", () => {
			Bus.emit('LOG', "BATTLE ENDED");
			localStorage.removeItem('currentBattle');

			if (window.parent) {
				window.parent.postMessage({
					type: "BATTLE_COMPLETE",
					result: [],
					xp: 0,
					loot: []
				}, "*");
			}
		});

		return;
	}
	if (alivePCs.length === 0) {
		victoryShown = true;

		refreshRetreatHp();
		
		showDefeatWindow("Your party has fallen.", () => {
			Bus.emit('LOG', "DEFEAT");
			localStorage.removeItem('currentBattle');

			if (window.parent) {
				window.parent.postMessage({
					type: "BATTLE_COMPLETE",
					result: [],
					xp: 0,
					loot: []
				}, "*");
			}
		});

		return;
		}
    if (aliveMonsters.length === 0) {
        victoryShown = true; // Set early to prevent parallel executions
		refreshRetreatHp();
        const savedData = JSON.parse(localStorage.getItem('currentBattle')) || {};
        const xp = battleXP;
        const loot = savedData.loot || [];

        const defeated = units
            .filter(u => u.type === 'monster')
            .map(u => u.name)
            .join("<br>");

        const lootHTML = loot.length
            ? loot.map(l => `${l.qty} × ${l.item}`).join("<br>")
            : "(none)";

        const summaryHTML = `
            <strong>Defeated Enemies:</strong><br>
            ${defeated}<br><br>
            <strong>XP Gained:</strong><br>
            ${xp}<br><br>
            <strong>Spoils:</strong><br>
            ${lootHTML}
        `;

        showVictoryWindow(summaryHTML, () => {
            Bus.emit('LOG', "VICTORY!");
            localStorage.removeItem('currentBattle');

            if (window.parent) {
                window.parent.postMessage({
                    type: "BATTLE_COMPLETE",
                    result: units.filter(u => u.type === 'pc'),
                    xp: battleXP,
                    loot: loot
                }, "*");
            }
        });
    }
}

function refreshRetreatHp() {
		for (const u of units) {
			if (u.retreatHp !== null) {
				u.hp = u.retreatHp;   // restore original HP
				u.retreatHp = null;   // clear the flag
			}
		}
}

function showVictoryWindow(summary, onClose) {
    const overlay = document.createElement('div');
    overlay.id = "victory-window";
    overlay.style = `
        position: fixed;
        top: 0; left: 0;
        width: 100vw; height: 100vh;
        background: rgba(0,0,0,0.8);
        color: white;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 99999;
        font-family: sans-serif;
        text-align: center;
    `;

    overlay.innerHTML = `
        <div style="background:#222; padding:20px; border-radius:10px; width:300px;">
            <h2 style="margin-top:0;">Victory!</h2>
            <div id="victory-summary" style="margin-bottom:20px; font-size:14px;">
                ${summary}
            </div>
			<div style="display: flex; justify-content: center; gap: 10px;">
			<button onclick="downloadBattleLog()" style="
				padding:10px 20px;
				background:#2980b9;
				border:none;
				color:white;
				border-radius:5px;
				cursor:pointer;
				font-size:16px;
			">battle_log.txt</button>
            <button id="victory-close" style="
                padding:10px 20px;
                background:#27ae60;
                border:none;
                color:white;
                border-radius:5px;
                cursor:pointer;
                font-size:16px;
            ">Continue</button>
        </div>
    `;

    document.body.appendChild(overlay);

	document.getElementById("victory-close").onclick = () => {
		console.log("DEBUG: Victory close clicked");
		overlay.remove();
		console.log("DEBUG: Overlay removed");

		if (onClose) {
			console.log("DEBUG: Calling onClose()");
			onClose();
		} else {
			console.log("DEBUG: No onClose callback");
		}
	};

}

function showDefeatWindow(summary, onClose) {
    showVictoryWindow(
        `<strong style="color:#e74c3c;">Defeat</strong><br><br>${summary}`,
        onClose
    );

    // Change the title text from "Victory!" to "Defeat"
    const title = document.querySelector("#victory-window h2");
    if (title) {
        title.textContent = "Defeat";
        title.style.color = "#e74c3c";
    }

    // Change button color
    const btn = document.getElementById("victory-close");
    if (btn) {
        btn.style.background = "#c0392b";
    }
}


//console.log("MONSTER_DB:", window.MONSTER_DB);


Bus.on('LOG', (msg) => {
    const l = document.getElementById('log');
    const entry = document.createElement('div');
    entry.innerText = `> ${msg}`;
    l.prepend(entry);
	//l.append(entry);

});

function copyBattleLog() {
    const logBox = document.getElementById("log");
    const lines = [...logBox.children].map(e => e.innerText);
    const chronological = lines.reverse().join("\n");

    navigator.clipboard.writeText(chronological)
        .then(() => console.log("Battle log copied to clipboard"))
        .catch(err => console.error("Copy failed:", err));
}


function downloadBattleLog() {
    const logBox = document.getElementById("log");
    const lines = [...logBox.children].map(e => e.innerText);
    const chronological = lines.reverse().join("\n");

    const blob = new Blob([chronological], { type: "text/plain" });
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "battle_log.txt";
    a.click();

    URL.revokeObjectURL(url);
}


init();
window.addEventListener("beforeunload", () => {
    console.warn("IFRAME IS BEING RELOADED!");
});

function scaleScreen() {
    const screen = document.getElementById("screen");
    const wrapper = document.getElementById("screen-wrapper");

    const baseWidth = 540;
    const baseHeight = 960;

    const scale = Math.min(
        wrapper.clientWidth / baseWidth,
        wrapper.clientHeight / baseHeight
    );

    screen.style.transform = `scale(${scale})`;
}

window.addEventListener("resize", scaleScreen);
window.addEventListener("load", scaleScreen);
