<style>
  * { box-sizing: border-box; margin: 0; padding: 0;

  }


  .icon {
    width: 56px;
    height: 56px;
  }
  .guild-image {
    position: relative;
    display: inline-block;
}

/* 1. The Container - Keep absolute so your JS top/left works */
.guild_licence, .guild_stash {
  position: absolute; 
  width: 64px;         /* Match your icon width */
  height: 64px;        /* Match your icon height */
  overflow: hidden;    /* This clips the shine so it doesn't bleed out */
}

/* 2. Your existing icon code stays as is */
.item-icon {
  width: 60px;
  display: block;
}

/* 2. The Shine Layer */
.guild_licence::after,
.guild_stash::after {
  content: "";
  position: absolute;
  top: 0;
  left: -200%; /* Hidden off-side by default */
  width: 100%;
  height: 100%;
  background: linear-gradient(
    90deg,
    transparent,
    rgba(255, 255, 255, 0.4),
    transparent
  );
  transform: skewX(-25deg);
  pointer-events: none;
  z-index: 10;
  
  /* This starts the 15-second loop automatically */
  animation: idleShine 15s infinite;
}

/* 3. The 15-second Loop Logic */
@keyframes idleShine {
  0% { left: -200%; }
  4% { left: 200%; }   /* The shine takes 0.6s (4% of 15s) to cross */
  100% { left: 200%; } /* It stays at the end for the remaining 14.4s */
}

/* 4. The Hover Logic */
.guild_licence:hover::after,
.guild_stash:hover::after {
  /* Stop the idle animation so they don't clash */
  animation: none; 
  /* Move it across immediately on hover */
  left: 200%;
  transition: left 0.6s ease-in-out;
}

/* 5. The "No-Reset" Fix */
/* This ensures that when you STOP hovering, it snaps back to the start 
   instantly (0s) instead of sliding backwards across the icon. */
.guild_licence::after,
.guild_stash::after {
  transition: left 0s; 
}

.hover-zone {
    position: absolute;
    top: 0;
    left: 0;
    width: 64px;
    height: 64px;
    cursor: pointer;
}

.tooltipmenu {
    display: none;
    position: absolute;
    background: #333;
    color: white;
    padding: 6px 10px;
    border-radius: 4px;
    top: 100%;
    left: 0;
    white-space: nowrap;
    z-index: 10;
}


.tooltip {
    position: fixed;
	transform: translateX(-150px);
    display: none;
    background: rgba(0,0,0,0.8);
    padding: 4px 8px;
    border: 1px solid #333;
    color: white;
    pointer-events: none;
    z-index: 10;
    white-space: nowrap;
}


.tooltip img {
    width: 500px; /* large image size */
}

.login-box {

.login-box input {

.login-box button {

.login-box button:hover {

#status {
    margin-top: 10px;
    color: #ccc;
}

/* 1. The Container */
.shine-container {
  position: relative;
  overflow: hidden;
  display: inline-block;
  line-height: 0; /* Removes bottom gap */
}

/* 2. Creating the Shine Layer */
.shine-container::after {
  content: '';
  position: absolute;
  top: 0;
  left: -100%; /* Start off-screen */
  width: 50%;
  height: 100%;
  background: linear-gradient(
    to right, 
    rgba(255, 255, 255, 0) 0%, 
    rgba(255, 255, 255, 0.3) 50%, 
    rgba(255, 255, 255, 0) 100%
  );
  transform: skewX(-25deg); /* Slant the shine */
}

/* 3. The Hover Animation */
.shine-container:hover::after {
  left: 150%; /* Move across to the other side */
  transition: left 0.7s ease-in-out;
}

</style>

<script>
console.log("Script loaded");



async function login() {
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();
    const status = document.getElementById("status");

    if (!username || !password) {
        status.textContent = "Enter username and password";
        return;
    }

    let player = await storage.getPlayer(username);

    if (!player) {
        // Auto-create new player
        player = {
            id: username,
            password: password,
            level: 1,
            xp: 0
        };

        await storage.savePlayer(player);
        status.textContent = "New player created!";
    } else {
        if (player.password !== password) {
            status.textContent = "Wrong password";
            return;
        }
    }

    localStorage.setItem("activePlayerId", username);
    status.textContent = "Login successful!";
		// Hide login, show game
	document.querySelector(".login-box").style.display = "none";
	document.getElementById("app-frame").style.display = "block";

}
</script>
