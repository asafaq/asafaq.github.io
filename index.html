<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>House of Glory, the "Adventurers" Guild</title>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; 
    user-select: none;
    -webkit-user-select: none;
    -moz-user-select: none;
}

  body {
    background: #222;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 40px 0;
  }

  .app-frame {
    display: none;
    width: 540px;
    height: 960px;
    background: #f5f5f5;
    border-radius: 12px;
    overflow-y: auto;
    position: relative;
    box-shadow: 0 20px 50px rgba(0,0,0,0.4);
  }

  .status-bar {
    width: 100%;
    height: 60px;
    background: #333;
    color: #fff;
    padding: 18px;
    font-size: 20px;
    font-weight: bold;
  }

  .main-window {
    padding: 5px;
    padding-right: 60px;
    background: #A28A65;
  }

  .right-menu {
    position: absolute;
    top: 120px;
    right: 0;
    width: 60px;
    height: 400px;
    background: #444;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 10px;
    gap: 10px;
    border-radius: 8px 0 0 8px;
  }

  .menu-item {
    width: 40px;
    height: 40px;
    background: #666;
    border-radius: 6px;
    cursor: pointer;
    position: relative;
    color: white;
    font-size: 20px;
    font-weight: bold;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .menu-item:hover { background: #888; }

  .menu-item:hover .tooltip {
    opacity: 1;
    transform: translateX(-10px);
  }


  .icon {
    width: 56px;
    height: 56px;
  }
  .guild-image {
    position: relative;
    display: inline-block;
}
.guild_licence {
    position: absolute;   /* positioned relative to main-container */
    z-index: 10;          /* ensures it's above the main image */
}

.item-icon {
    width: 64px; /* small image size */
}

.hover-zone {
    position: absolute;
    top: 0;
    left: 0;
    width: 64px;
    height: 64px;
    cursor: pointer;
}

.tooltipmenu {
    display: none;
    position: absolute;
    background: #333;
    color: white;
    padding: 6px 10px;
    border-radius: 4px;
    top: 100%;
    left: 0;
    white-space: nowrap;
    z-index: 10;
}


.tooltip {
    position: fixed;
	transform: translateX(-150px);
    display: none;
    background: rgba(0,0,0,0.8);
    padding: 4px 8px;
    border: 1px solid #333;
    color: white;
    pointer-events: none;
    z-index: 10;
    white-space: nowrap;
}


.tooltip img {
    width: 500px; /* large image size */
}


.login-box {
    background: #333;
    padding: 20px;
    border-radius: 10px;
    width: 250px;
    text-align: center;
    color: white;
}

.login-box input {
    width: 90%;
    padding: 8px;
    margin: 8px 0;
    border: none;
    border-radius: 5px;
}

.login-box button {
    width: 95%;
    padding: 10px;
    background: #4CAF50;
    border: none;
    border-radius: 5px;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.login-box button:hover {
    background: #45a049;
}

#status {
    margin-top: 10px;
    color: #ccc;
}



</style>
</head>
<!-- <button onclick="saveGame()">Save</button> -->
<!-- <button onclick="loadGame()">Load</button> -->

<div class="login-box">
    <h2>Login</h2>

    <input id="username" type="text" placeholder="Username">
    <input id="password" type="password" placeholder="Password">

    <button onclick="login()">Login</button>

    <p id="status"></p>
</div>


<body>
<script>
    let database = { players: [] }; // default placeholder
</script>

    <script src="database.js"></script>
	<script src="ui.js"></script>
	
	<script>
    const storage = new databaseStorage();
	</script>

	<script src="login.js"></script>

<div class="app-frame" id="app-frame">

  <div class="status-bar">Status Line</div>

  <div class="main-window" id="mainWindow">
    <h2>Welcome</h2>
    <p>Select a menu item to change this content.</p>
    <p>Scroll down to test scrolling.</p>
    <p style="margin-top:800px;">Bottom of content.</p>
  </div>

  <div class="right-menu">
    <div class="menu-item" onclick="loadPage('guild')">
      <img src="assets/menu/menu_home.png" class="icon">
      <div class="tooltipmenu">Guild</div>
    </div>
    <div class="menu-item" onclick="loadPage('contracts')">
      <img src="assets/menu/menu_contracts.png" class="icon">
      <div class="tooltipmenu">Contract</div>

<script>
console.log("Script loaded");



async function login() {
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();
    const status = document.getElementById("status");

    if (!username || !password) {
        status.textContent = "Enter username and password";
        return;
    }

    let player = await storage.getPlayer(username);

    if (!player) {
        // Auto-create new player
        player = {
            id: username,
            password: password,
            level: 1,
            xp: 0
        };

        await storage.savePlayer(player);
        status.textContent = "New player created!";
    } else {
        if (player.password !== password) {
            status.textContent = "Wrong password";
            return;
        }
    }

    localStorage.setItem("activePlayerId", username);
    status.textContent = "Login successful!";
		// Hide login, show game
	document.querySelector(".login-box").style.display = "none";
	document.getElementById("app-frame").style.display = "block";

}
</script>
    </div>
    <div class="menu-item" onclick="loadPage('missions')">
      <img src="assets/menu/menu_missions.png" class="icon">
      <div class="tooltipmenu">Missions</div>
    </div>
    <div class="menu-item" onclick="loadPage('market')">
      <img src="assets/menu/menu_store.png" class="icon">
      <div class="tooltipmenu">Market</div>
    </div>
	<div class="menu-item" onclick="loadPage('journal')">
      <img src="assets/menu/menu_journal.png" class="icon">
      <div class="tooltipmenu">Journal</div>
    </div>
	<div class="menu-item" onclick="loadPage('mail')">
      <img src="assets/menu/menu_mail.png" class="icon">
      <div class="tooltipmenu">Mail</div>
    </div>
    </div>
  </div>

</div>



</body>
</html>
