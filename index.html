<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>House of Glory, the "Adventurers" Guild</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="missions.css">

</head>
<!-- <button onclick="saveGame()">Save</button> -->
<!-- <button onclick="loadGame()">Load</button> -->

<body>

	<div class="app-wrapper">
		<div class="login-wrapper">
			<div class="login-box">
			<p>Login / Register</p>
			<input id="username" type="text" placeholder="Username">
			<input id="password" type="password" placeholder="Password">
			<button onclick="login()">Login</button>

			<p id="status"></p>
			</div>
		</div>
<div class="app-frame" id="app-frame">
			<div id="loadingScreen">
				Loading assets...
			</div>
<div id="battle-container" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; z-index:999;">
    <iframe id="battle-frame" src="" style="width:100%; height:100%; border:none;"></iframe>
</div>

        <!-- ✅ GLOBAL CONFIRM DIALOG (always present, never overwritten) -->
        <div id="confirm-dialog" class="confirm hidden">
            <div class="confirm-box">
                <div id="confirm-text"></div>
                <div class="confirm-buttons">
                    <button id="confirm-yes">Yes</button>
                    <button id="confirm-no">No</button>
                </div>
            </div>
        </div>
  <div id="window-container"></div>
	<div class="status-bar">
		<span class="status-bar-text"></span>
	</div>


  <div class="main-window" id="mainWindow">
    <h2>Welcome</h2>
    <p>Select a menu item to change this content.</p>
  </div>
  <div id="overlay" class="hidden"></div>

  <div class="right-menu">
    <div class="menu-item" onclick="loadPage('guild')">
      <img src="assets/menu/menu_home.png" class="icon">
      <div class="tooltipmenu">Guild</div>
    </div>
	<div class="menu-item" onclick="loadPage('tavern')">
      <img src="assets/menu/menu_tavern.png" class="icon">
      <div class="tooltipmenu">Tavern</div>
    </div>
    <div class="menu-item" onclick="loadPage('contracts')">
      <img src="assets/menu/menu_contracts.png" class="icon">
      <div class="tooltipmenu">Contract</div>
      </div>
    <div class="menu-item" onclick="loadPage('missions')">
      <img src="assets/menu/menu_missions.png" class="icon">
      <div class="tooltipmenu">Missions</div>
    </div>
    <div class="menu-item" onclick="renderGuildSatchelPage()">
      <img src="assets/inventory/knabsack.png" class="icon">
      <div class="tooltipmenu">Satchel</div>
    </div>
	<div class="menu-item" onclick="loadPage('journal')">
      <img src="assets/menu/menu_journal.png" class="icon">
      <div class="tooltipmenu">Lore</div>
    </div>
	<div class="menu-item" onclick="loadPage('mail')">
      <img src="assets/menu/menu_mail.png" class="icon">
      <div class="tooltipmenu">Mail</div>
    </div>
	<div class="menu-item" onclick="loadPage('lore')">
      <img src="assets/menu/menu_lore.png" class="icon">
      <div class="tooltipmenu">Lore</div>
    </div>
    <div class="menu-item" onclick="loadPage('market')">
      <img src="assets/menu/menu_store.png" class="icon">
      <div class="tooltipmenu">Market</div>
    </div>
    <div class="menu-item" onclick="loadPage('cogwheel')">
      <img src="assets/menu/cogwheel_L.png" class="icon">
      <div class="tooltipmenu">Market</div>
    </div>
    </div>

  <div class="right-menu-mini">
    <div class="menu-item" onclick="loadPage('guild')">
      <img src="assets/menu/menu_home.png" class="icon">
      <div class="tooltipmenu">Guild</div>
    </div>
    <div class="menu-item" onclick="renderGuildSatchelPage()">
      <img src="assets/inventory/knabsack.png" class="icon">
      <div class="tooltipmenu">Satchel</div>
    </div>
  </div>
  
  <div class="tutorial-window">
    <div id="tutorial-text"></div>
    <div id="tutorial-choices"></div>

  </div>
	<!-- Place this inside your existing 540x960 body -->
	<div id="m-viewport">
		<!-- The main dialog container -->
		<div id="m-dialog-box" class="m-glass-panel">
			<p style="color: rgba(255,255,255,0.5);">Loading Missions...</p>
		</div>

		<!-- The container for buttons -->
		<div id="m-choices-container"></div>

		<!-- The Reset Button (Positioned at very bottom right) -->
		<!-- <button id="m-reset-btn" onclick="resetGame()">RESET PROGRESS</button> -->
	</div>
  </div>


</div>
<script>
window.templates = window.templates || {};

templates.satchel_guild = `
    <div id="satchel" class="satchel-window">
        <div class="close-btn" id="close-satchel">X</div>
        <img src="assets/menu/satchel.png" id="satchel-icon" class="item-icon chest-icon">
        <div class="satchel-grid hidden"></div>
    </div>
`;

templates.satchel_mission = `
    <div id="satchel" class="satchel-window">
        <div class="close-btn" id="close-satchel">X</div>
        <img src="assets/inventory/knabsack.png" id="satchel-icon" class="item-icon chest-icon">
        <div class="satchel-grid hidden"></div>
    </div>
`;
</script>

<script src="login.js"></script>
<script src="battlelauncher.js"></script>
<script src="inventory.js"></script>
<script src="database.js"></script>
<script src="missions_rules.js"></script>
<script src="missions.js"></script>
<script src="ui.js" defer></script>

</div>
</body>
</html>
